# The harness's own negative fixtures: thirteen planted regressions the release
# gate must catch, each attributed to the right artefact. `harness mutants`
# builds each one from the base reader image, runs release mode (base vs
# mutant) and asserts the verdict is FAIL with at least one unclaimed hunk of
# the expected artefact. A harness that cannot catch its own mutants has no
# business gating a release.
#
# `runs` is the number of journey repetitions the mutant needs to be caught;
# only the timing mutant needs more than one, and it needs FIVE: Mann-Whitney
# at alpha 0.05 cannot say "slower" from fewer than four samples a side (3 v 3
# perfectly separated is p = 0.081), and five is the least that keeps a single
# overlapping pair from hiding it (5 v 5 is p = 0.012 separated, 0.022 with one pair swapped;
# 4 v 4 with one pair swapped is 0.061). See docs/noise-burndown.md, "k6 timing spread".
#
# `kind` is how the mutant is made (src/mutant-build.ts): `edge` (default) is
# the wrapper in wrap.mjs planting a fault at the HTTP edge; `planted-package`
# and `base-swap` change what the image IS, and are caught by the static image
# artefacts (image-manifest, sbom) rather than by anything a browser sees.
#
# Since 1.25.0 every policy check (src/compare/policy.ts) has one too: `secret-env`,
# `vulnerable-package` and `unsigned-build`. A policy check is informing until 2.0
# (src/compare/levels.ts), so it cannot FAIL a run yet: its mutant is caught when the
# check reports a finding on the mutant that it did not report on the base in the
# self-test's own A/A ("new on b"). The day a check becomes blocking, the same mutant
# must FAIL the run, as every other mutant does. This is the soak's proof that each
# check that may become blocking can fail at all.
mutants:
  - name: dropped-header
    plants: the X-Content-Type-Options header is no longer sent
    expect: [headers]

  - name: route-500
    plants: every /course/* document request answers 500
    expect: [network, dom]

  - name: console-error
    plants: a console.error on every server-rendered page
    expect: [console]

  - name: dom-note
    plants: an extra landmark at the end of every page body
    expect: [dom]

  - name: missing-alt
    plants: an image with no alternative text on every page
    expect: [axe]

  - name: slow-ssr
    plants: 400 ms added to every HTML response
    expect: [timing]
    runs: 5

  - name: anon-write
    plants: every page records a learning event for anonymous readers
    expect: [persistence]

  - name: focus-order
    plants: navigator links leave the tab order
    expect: [focus]

  - name: base-swap
    kind: base-swap
    plants: the candidate is built FROM a different base image (the production filesystem over another distribution)
    expect: [image-manifest]

  - name: added-package
    kind: planted-package
    plants: the candidate carries one package the production image does not
    expect: [sbom]

  - name: secret-env
    kind: planted-secret
    plants: the candidate's image config carries an environment variable whose name says it holds a secret
    expect: [image-hardening]

  - name: vulnerable-package
    kind: planted-vuln
    plants: the candidate carries a package with a known critical advisory that has a fix
    expect: [vuln-ceiling]

  - name: unsigned-build
    kind: unsigned
    plants: the candidate is the production image under a local name, not pulled and signature-verified, so it has no verified build provenance
    expect: [build-provenance]
