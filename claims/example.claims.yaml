# Example only. A real release keeps its claims beside its changelog in the
# monorepo's release PR and passes the file with --claims.
claims:
  - artefact: dom
    scope: "reader:lab-step*"
    reason: "Rule 0031: lab steps shall show estimated reading time"
  - artefact: network
    scope: "GET /api/presence"
    reason: "Rule 0044: presence polled every 15s, was 10s"
