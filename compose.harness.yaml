# Two identical Tutors stacks, "a" and "b", that differ only in the application
# images, plus the fixtures both sides share (course server, identity stub,
# clock) and the ones each side owns (a persistence stub, so writes are
# attributable).
#
# The harness CLI sets every *_IMAGE_* variable from --a / --b before it runs
# `docker compose up`; the defaults below only exist so the file can be started
# by hand:
#
#   READER_IMAGE_A=tutors/reader:16.2.0 READER_IMAGE_B=tutors/reader:16.3.0-rc.1 \
#     docker compose -p tutors-harness -f compose.harness.yaml up -d --wait
#
# The apps run exactly as the monorepo's e2e stack runs them: anonymous mode,
# read-only root filesystem, no capabilities, JSON logs. Each side also runs a
# second reader with sign-in enabled (reader-auth-*), pointed at the identity
# and persistence stubs. Nothing here may differ between the two sides except
# the image reference: any other difference would show up in the report as the
# harness's own noise.
#
# Profiles: `upgrade` adds the edge proxy in front of both readers.
name: tutors-harness

networks:
  default:
    ipam:
      config:
        # Fixed so the identity stub can be given a stable address that the
        # readers' extra_hosts entries point github.com at.
        - subnet: 172.29.0.0/24

x-app: &app
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/healthz/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 2s
    timeout: 3s
    retries: 30
  depends_on:
    course:
      condition: service_healthy

# Identical on both sides. HARNESS_NOW is the clock fixture (fixtures/clock):
# test builds that honour it see a frozen wall clock, and the harness also
# freezes the browser clock to the same instant.
x-env: &env
  PUBLIC_ANON_MODE: "TRUE"
  LOG_LEVEL: info
  HARNESS_NOW: ${HARNESS_NOW:-2026-09-16T09:05:00.000Z}
  # Anonymous mode with a secret set, as a deployment that also offers sign-in
  # would run it. Not a real secret; it exists only inside this stack.
  PRIVATE_AUTH_SECRET: harness-only-not-a-real-secret-000000000000

# The signed-in reader: auth on, GitHub OAuth pointed at the identity stub,
# Supabase pointed at the side's persistence stub. Same secret on both sides
# so session cookies are comparable.
x-auth-env: &auth-env
  PUBLIC_ANON_MODE: ""
  LOG_LEVEL: info
  HARNESS_NOW: ${HARNESS_NOW:-2026-09-16T09:05:00.000Z}
  PRIVATE_AUTH_SECRET: harness-only-not-a-real-secret-000000000000
  PRIVATE_AUTH_GITHUB_ID: harness-client-id
  PRIVATE_AUTH_GITHUB_SECRET: harness-client-secret
  PUBLIC_SUPABASE_ANON_KEY: harness-anon-key
  NODE_EXTRA_CA_CERTS: /harness/ca.pem

x-auth-hosts: &auth-hosts
  - "github.com:172.29.0.10"
  - "api.github.com:172.29.0.10"
  - "persistence-a.harness.test:host-gateway"
  - "persistence-b.harness.test:host-gateway"

x-stub: &stub
  image: node:22-bookworm-slim
  init: true
  read_only: true
  user: "1001:0"

services:
  # ---- shared fixtures ----------------------------------------------------
  course:
    <<: *stub
    command: ["node", "/fixture/serve.mjs", "/srv/course", "8080"]
    volumes:
      - ./fixtures/course-server/serve.mjs:/fixture/serve.mjs:ro
      - ./fixtures/course-server/course:/srv/course:ro
    # Course pages are client-rendered: the browser fetches
    # http://localhost:8080/tutors.json directly, so the fixture is published
    # on the host at the course id's port and both sides share it.
    ports:
      - "${COURSE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  identity:
    <<: *stub
    command: ["node", "/fixture/stub.mjs"]
    environment:
      PORT: "443"
      HARNESS_ROLE: ${HARNESS_ROLE:-student}
    # Binding 443 as UID 1001 inside the container.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ./fixtures/identity/stub.mjs:/fixture/stub.mjs:ro
      - ./fixtures/identity/certs:/fixture/certs:ro
    networks:
      default:
        ipv4_address: 172.29.0.10
    ports:
      - "${IDENTITY_PORT:-8443}:443"
    healthcheck:
      # The stub's certificate is signed by the harness's test CA, which the healthcheck's Node does not trust.
      test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://127.0.0.1:443/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 15

  # ---- side a -------------------------------------------------------------
  persistence-a:
    <<: *stub
    command: ["node", "/fixture/stub.mjs", "8090"]
    volumes:
      - ./fixtures/persistence/stub.mjs:/fixture/stub.mjs:ro
    ports:
      - "${PERSISTENCE_PORT_A:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  reader-a:
    <<: *app
    image: ${READER_IMAGE_A:-tutors/reader:local}
    ports:
      - "${READER_PORT_A:-3100}:3000"
    environment:
      <<: *env
      ORIGIN: http://localhost:${READER_PORT_A:-3100}
      # Ignored by the apps; read by the anon-write mutant (mutants/wrap.mjs).
      HARNESS_PERSISTENCE_URL: http://persistence-a.harness.test:${PERSISTENCE_PORT_A:-8090}

  catalogue-a:
    <<: *app
    image: ${CATALOGUE_IMAGE_A:-tutors/catalogue:local}
    ports:
      - "${CATALOGUE_PORT_A:-3101}:3000"
    environment:
      <<: *env
      ORIGIN: http://localhost:${CATALOGUE_PORT_A:-3101}

  live-a:
    <<: *app
    image: ${LIVE_IMAGE_A:-tutors/live:local}
    ports:
      - "${LIVE_PORT_A:-3102}:3000"
    environment:
      <<: *env
      ORIGIN: http://localhost:${LIVE_PORT_A:-3102}

  reader-auth-a:
    <<: *app
    image: ${READER_IMAGE_A:-tutors/reader:local}
    ports:
      - "${READER_AUTH_PORT_A:-3103}:3000"
    extra_hosts: *auth-hosts
    volumes:
      - ./fixtures/identity/certs/ca.pem:/harness/ca.pem:ro
    environment:
      <<: *auth-env
      ORIGIN: http://localhost:${READER_AUTH_PORT_A:-3103}
      PUBLIC_SUPABASE_URL: http://persistence-a.harness.test:${PERSISTENCE_PORT_A:-8090}
    depends_on:
      course:
        condition: service_healthy
      identity:
        condition: service_started
      persistence-a:
        condition: service_healthy

  # ---- side b -------------------------------------------------------------
  persistence-b:
    <<: *stub
    command: ["node", "/fixture/stub.mjs", "8091"]
    volumes:
      - ./fixtures/persistence/stub.mjs:/fixture/stub.mjs:ro
    ports:
      - "${PERSISTENCE_PORT_B:-8091}:8091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  reader-b:
    <<: *app
    image: ${READER_IMAGE_B:-tutors/reader:local}
    ports:
      - "${READER_PORT_B:-3200}:3000"
    environment:
      <<: *env
      ORIGIN: http://localhost:${READER_PORT_B:-3200}
      # Ignored by the apps; read by the anon-write mutant (mutants/wrap.mjs).
      HARNESS_PERSISTENCE_URL: http://persistence-b.harness.test:${PERSISTENCE_PORT_B:-8091}

  catalogue-b:
    <<: *app
    image: ${CATALOGUE_IMAGE_B:-tutors/catalogue:local}
    ports:
      - "${CATALOGUE_PORT_B:-3201}:3000"
    environment:
      <<: *env
      ORIGIN: http://localhost:${CATALOGUE_PORT_B:-3201}

  live-b:
    <<: *app
    image: ${LIVE_IMAGE_B:-tutors/live:local}
    ports:
      - "${LIVE_PORT_B:-3202}:3000"
    environment:
      <<: *env
      ORIGIN: http://localhost:${LIVE_PORT_B:-3202}

  reader-auth-b:
    <<: *app
    image: ${READER_IMAGE_B:-tutors/reader:local}
    ports:
      - "${READER_AUTH_PORT_B:-3203}:3000"
    extra_hosts: *auth-hosts
    volumes:
      - ./fixtures/identity/certs/ca.pem:/harness/ca.pem:ro
    environment:
      <<: *auth-env
      ORIGIN: http://localhost:${READER_AUTH_PORT_B:-3203}
      PUBLIC_SUPABASE_URL: http://persistence-b.harness.test:${PERSISTENCE_PORT_B:-8091}
    depends_on:
      course:
        condition: service_healthy
      identity:
        condition: service_started
      persistence-b:
        condition: service_healthy

  # ---- upgrade rehearsal ------------------------------------------------------
  # The router in front of a rolling deployment: starts on a, is switched to b
  # under load, and tags every response with the upstream that answered.
  edge:
    <<: *stub
    profiles: ["upgrade"]
    command: ["node", "/fixture/edge.mjs"]
    environment:
      PORT: "3000"
      UPSTREAM_A: http://reader-a:3000
      UPSTREAM_B: http://reader-b:3000
    volumes:
      - ./fixtures/edge/edge.mjs:/fixture/edge.mjs:ro
    ports:
      - "${EDGE_PORT:-3300}:3000"
    depends_on:
      reader-a:
        condition: service_healthy
      reader-b:
        condition: service_healthy
