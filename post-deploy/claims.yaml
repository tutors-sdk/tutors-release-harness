# Post-deploy claims: differences between live production and the recorded release run that are known and
# explained, so the synthetic monitor (.github/workflows/post-deploy.yml, `harness local watch`) does not keep
# failing on them. Read with `--claims` by post-deploy mode only; release mode reads the release's own
# claims.yaml from the monorepo, never this file.
#
# Same format and matcher as any claims file (claims/README.md): artefact, scope glob, reason. A claim here
# excuses a difference between production and the tested release, so every one is narrow (one artefact, one page
# or one request) and carries `until`: the release after which it should no longer be needed. In post-deploy mode
# side a is the recorded release, so `until: "16.2.3"` expires as soon as the recorded run is any release after
# 16.2.2 (16.2.3, 16.3.0, ...). Claim lifetimes are informing until harness 2.0: an expired claim is reported and
# still covers, so remove a claim once it is stale or expired.
#
# Empty is the normal state: `claims: []`.
# The five claims for tutors-release-harness#38 (the untracked 2026-09-18 build) expired with 17.0.0, which replaced
# that build; four matched nothing on 15 Oct 2026 and the fifth would hide a 17.0.0 difference. Removed in 1.40.0.
claims:
  # Netlify serves production without the `Cache-Control: public, max-age=31536000, immutable` that the release images
  # send for SvelteKit's hashed assets: the apps' netlify.toml sets it on `/build/*`, but SvelteKit serves them from
  # `/_app/immutable/*`. The assets are only cached for less long. Fixed by tutors-sdk/tutors-mono-repo#500, which
  # reaches production with the next release: the claim expires once the recorded release is 17.0.1 or later. Rollback
  # issue tutors-sdk/tutors-release-harness#131.
  - artefact: network
    scope: "GET /_app/immutable/**"
    reason: "Issue #131: Netlify omits the immutable Cache-Control on /_app/immutable/* that the release images send; fixed by tutors-sdk/tutors-mono-repo#500"
    until: "17.0.1"
  # The keyboard order the recorded 17.0.0-rc.1 run kept for reference:topic and reference:lab began at the card the
  # journey had just clicked, not at the top: before 1.48.4 the walk blurred and pressed Tab, and a blur leaves Tab's
  # starting point where focus was. Since 1.48.4 production is walked from the top, so these two pages differ from the
  # recording without any change in production (issue #131). The next release is recorded with 1.48.4 or later.
  - artefact: focus
    scope: "reference:topic"
    reason: "Issue #131: the recorded 17.0.0-rc.1 walked reference:topic from the clicked card (harness before 1.48.4), production is walked from the top"
    until: "17.0.1"
  - artefact: focus
    scope: "reference:lab"
    reason: "Issue #131: the recorded 17.0.0-rc.1 walked reference:lab from the clicked card (harness before 1.48.4), production is walked from the top"
    until: "17.0.1"
