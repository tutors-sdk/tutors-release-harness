# The course corpus: live, public Tutors courses the harness captures and checks (docs/course-capture.md).
#
#   pnpm harness course capture --corpus fixtures/course-corpus/courses.yaml
#   pnpm harness course check --corpus fixtures/course-corpus/courses.yaml --reader http://localhost:3100
#
# At most five courses (Leigh, 2026-10-08), each captured alone: a portfolio's linked courses are not followed, so
# the corpus is exactly what this file names. Add a course only with a reason; replace one before adding a sixth.
# `standard` is the course a check or a benchmark uses when it is given none.
standard: wit-hdip-comp-sci-2024

courses:
  - course: https://tutors.dev/course/wit-hdip-comp-sci-2024
    why: The standard (Leigh, 2026-10-08). WIT/SETU Higher Diploma in Computer Science 2024, a portfolio of 23 module courses.
    skipExt: [mp4, mov]
    maxFileMb: 50
  # Module courses (Leigh, 2026-10-08: "add more modules ... we want signal depth"). The portfolio above is mostly links,
  # so these are where a student reads: labs with many steps, notes, talks, images and archives.
  - course: https://tutors.dev/course/wit-hdip-comp-sci-2024-programming
    why: Programming, the largest first-semester module (489 learning objects, 647 files). Many labs with long step sequences.
    skipExt: [mp4, mov, zip]
    maxFileMb: 20
  - course: https://tutors.dev/course/wit-hdip-comp-sci-2024-full-stack-1
    why: Full Stack 1, the largest module (529 learning objects, 619 files), heavy on images and talks.
    skipExt: [mp4, mov, zip]
    maxFileMb: 20
  - course: https://tutors.dev/course/setu-hdip-comp-sci-2024-comp-sys
    why: Computer Systems (315 learning objects, 504 files), a SETU course built by a different author, so a different shape of tree.
    skipExt: [mp4, mov, zip]
    maxFileMb: 20
  - course: https://tutors.dev/course/databases-2024
    why: Databases (381 learning objects, 436 files), notes and labs with SQL code blocks and many diagrams.
    skipExt: [mp4, mov, zip]
    maxFileMb: 20
