# Drop into tutors-sdk/tutors-mono-repo/.github/workflows/publish-images.yml
#
# Builds the four app images from the root Dockerfile and pushes them to GHCR:
#   push to main  -> ghcr.io/tutors-sdk/tutors/<app>:sha-<short>  and :main
#   tag v16.2.0   -> ghcr.io/tutors-sdk/tutors/<app>:16.2.0       and :latest
#   tag v16.3.0-rc.1 -> ghcr.io/tutors-sdk/tutors/<app>:16.3.0-rc.1
# Each image is signed (cosign keyless) and gets an SBOM attestation.
#
# The release harness pulls these by tag: --a 16.2.0 --b 16.3.0-rc.1.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [reader, catalogue, live, time]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tutors/${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=tutors-${{ matrix.app }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.app }}
          cache-to: type=gha,scope=publish-${{ matrix.app }},mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done

      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tutors/${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
