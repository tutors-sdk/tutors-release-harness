# Diagnostic only, on branch claude/diag-signin (never merged): why does student-signs-in take ~23 s on side b
# and ~4 s on side a since 9 Oct 2026? Runs the same images on both sides, then main on both, and traces sign-in.
name: Diagnose sign-in on side b
on:
  push:
    branches: [claude/diag-signin]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pair: ["17.0.0 sha-c867ee8", "sha-c867ee8 17.0.0"]
    env:
      HARNESS_IMAGE_PREFIX: quay.io/tutors-sdk/tutors-{app}
      HARNESS_COSIGN_IDENTITY: '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@'
      HARNESS_COMPOSE_PROJECT: tutors-harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Timing through the harness, both sides the same images
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          set -- $PAIR
          pnpm harness images ensure --a "$1" --b "$2"
          pnpm harness run --mode any-two --a "$1" --b "$2" --journey student-signs-in --runs 2 --no-runtime --startup-restarts 0 --noise none --keep --out out || true
          grep -rh "student-signs-in" out/*/report.md | head -20 || true
          find out -name "*.json" -path "*timing*" | head -5
      - name: Container logs
        if: always()
        run: |
          for s in reader-auth-a reader-auth-b reader-auth-edge-a reader-auth-edge-b persistence-a persistence-b identity; do
            echo "::group::$s"; docker compose -p "$HARNESS_COMPOSE_PROJECT" -f compose.harness.yaml logs --no-color --timestamps "$s" 2>&1 | tail -150; echo "::endgroup::"
          done
