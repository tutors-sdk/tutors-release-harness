# The kept reports, as a website anyone can open and share: GitHub Pages.
#
# The branches the other workflows push already keep every report.html with a
# reports/index.json (docs/contract.md, "Kept reports"). This copies each
# branch's reports/ beside site/index.html, which lists them, and deploys the
# lot. Nothing is generated or judged here, and no branch is written.
#
#   <pages>/                                  site/index.html
#   <pages>/release-records/reports/...       release candidates
#   <pages>/main-preview/reports/...          Main to RC forecasts
#   <pages>/noise/reports/...                 nightly A/A
#   <pages>/scoreboard.html, scoreboard.json  the release scoreboard's six trend views, run rules and the harness's health
#                                             (harness scoreboard trends --site, from the `scoreboard` branch; since 1.11.0)
#   <pages>/a3.html, a3.json, github.json     the A3 Aggregator: one Lean A3 from every kept report, the kaizen register
#                                             and the value stream's workflow history (harness a3 --site; since 1.14.0)
#   <pages>/readiness.html, readiness.json    the overnight readiness page: Main to RC night by night, the last ten nights
#                                             (harness readiness --site, from the forecasts and github.json; since 1.17.0),
#                                             each forecast with the quality marks (since 1.18.0), led by the
#                                             release-size control chart (since 1.19.0; releases.json, its history)
#   <pages>/courses/sides.json, a/, b/        the course corpus checked in production's reader (a) and main's (b), from
#                                             the newest course-corpus-check artifact of course-capture.yml on main; the
#                                             A3 shows it as "Real courses" (since 1.31.0)
#
# Rebuilt after every workflow that keeps a report, when the page changes on
# main, and by hand. Repository setting: Pages, source "GitHub Actions".
name: Report pages

on:
  workflow_run:
    workflows: ["Nightly noise (A/A)", "Release harness", "Main to RC", "Course capture"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # Since 1.14.0: the A3 Aggregator reads the value stream's workflow runs (harness a3 --fetch-github). Read only.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Collect the kept reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy each branch's reports beside the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp site/index.html _site/
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for branch in release-records main-preview noise; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone -q --depth 1 --branch "$branch" "$remote" "src-$branch" 2>/dev/null && [ -f "src-$branch/reports/index.json" ]; then
              mkdir -p "_site/$branch" && cp -R "src-$branch/reports" "_site/$branch/reports"
              echo "$branch: $(jq '.runs | length' "_site/$branch/reports/index.json") report(s)"
            else
              echo "$branch: no kept reports yet"
            fi
          done
          # The scoreboard: its six trend views from the `scoreboard` branch, beside the nightly's noise history for the harness's
          # own health. No branch yet is an explicit "no releases scored yet" page, never a missing one.
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone -q --depth 1 --branch scoreboard "$remote" src-scoreboard 2>/dev/null; then
            echo "scoreboard: no branch yet"; mkdir -p src-scoreboard/scoreboard
          fi
          pnpm harness scoreboard trends --file src-scoreboard/scoreboard/releases.jsonl --mutants src-scoreboard/scoreboard/mutants.jsonl --noise-history src-noise/noise-history.json --site _site
          # Since 1.31.0: the newest corpus check course-capture.yml kept on main (a scheduled or dispatched run; a pull
          # request's is not main's), so the A3 can show real courses on production and main. None kept leaves that out.
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow course-capture.yml --branch main --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name course-corpus-check --dir _site/courses 2>/dev/null && [ -f _site/courses/sides.json ]; then
              echo "courses: course-corpus-check from run $id"; break
            fi
            rm -rf _site/courses
          done
          # The A3 Aggregator reads what is now in _site, the kaizen register of this checkout and the workflows' history.
          # It is advisory and never fails the site: a failure leaves a3.html out and the index says so.
          if [ -f src-noise/noise-history.json ]; then mkdir -p _site/noise && cp src-noise/noise-history.json _site/noise/noise-history.json; fi
          pnpm harness a3 --site _site --kaizen kaizen --noise-history _site/noise/noise-history.json --scoreboard src-scoreboard/scoreboard/releases.jsonl --mutants src-scoreboard/scoreboard/mutants.jsonl --fetch-github || echo "::warning title=A3 Aggregator::harness a3 did not write the A3"
          jq -n --arg at "$(date -u +%FT%TZ)" '{builtAt: $at}' > _site/built.json
          touch _site/.nojekyll
      # Since 1.17.0: one row per night for the last ten, from the kept forecasts and the github.json the A3 just wrote
      # (without it, a night that kept nothing is "not known"). Advisory like the A3: a failure is a warning, never a broken site.
      # Since 1.18.0 each row carries the quality marks; --mutants is the Tests mark's weekly self-test (not measured without it).
      # Since 1.19.0 it leads with the release-size control chart: --fetch-releases reads the monorepo's tags and the PRs
      # between them once per build (GET only, the job's read token) into _site/releases.json. GitHub not answering is said
      # on the page, never a failure.
      - name: The overnight readiness page
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm harness readiness --site _site --mutants src-scoreboard/scoreboard/mutants.jsonl --fetch-releases || echo "::warning title=Overnight readiness::harness readiness did not write the page"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Since v4 dotfiles are left out unless asked for: keep .nojekyll, as v3 did.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploys the site and nothing else: no branch, tag, issue or other repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
