# The harness's own signal: every planted regression must be caught and
# attributed. A harness that cannot catch its own mutants has no business
# gating a release.
#
# Weekly, on demand, and on every pull request: a PR that touches an engine, a
# mask, a journey, a collector, a fixture, a stack, the gate or a mutant
# (src/ci/engine-change.ts lists the paths, and a test keeps the list complete) must bump the harness version and pass the mutants before it merges.
# "Mutants re-run (required)" always reports, so it can be a required check;
# on any other PR it passes without running them.
name: Weekly mutants

on:
  schedule:
    - cron: "41 3 * * 1"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Base tag to plant mutants on"
        required: false

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Engine change? Version bumped?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_mutants: ${{ steps.detect.outputs.engine_changed || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'pull_request'
      - name: Engine paths touched, and the version bumped if so
        id: detect
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm harness guard engine --base "$BASE_SHA"

  mutants:
    needs: changes
    if: needs.changes.outputs.run_mutants == 'true'
    # Pinned, not ubuntu-latest: the A/A measures the noise floor of THIS runner image (fonts, anti-aliasing,
    # timing), and this job runs journeys the same way; nightly-noise.yml pins the same one. Move them all together,
    # in one PR, and expect a fresh burn-down after (docs/noise-burndown.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      # Who must have signed a pulled image: the monorepo's image-build.yml workflow (docs/contract.md).
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
      TAG: ${{ inputs.tag || vars.HARNESS_PRODUCTION_TAG || 'main' }}
      # grype, pinned: the version download-grype installs, and part of the database cache key.
      GRYPE_VERSION: v0.119.0
      # syft, pinned: the SBOM generator of the mutants (the version the harness's parsers are tested against).
      SYFT_VERSION: v1.52.0
      # The one directory every scan reads: the default of a local run is HARNESS_HOME/vuln-db, the same place (docs/local.md).
      HARNESS_VULN_DB_DIR: ${{ github.workspace }}/.harness/vuln-db
      # What the apps load from Google Fonts, Iconify and jsDelivr, as recorded once (src/collectors/third-party-cache.ts): the
      # default of a local run is HARNESS_HOME/third-party-cache, the same place.
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The browser is answered from one recorded copy of what the apps load from Google Fonts, Iconify and jsDelivr: the same
      # bytes on both sides, at once, so a font or an icon cannot arrive on one side only, and an outage of those hosts breaks
      # nothing (docs/noise-burndown.md). The key never matches exactly; restore-keys picks the newest entry.
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The image-level mutants (base-swap, added-package) are built locally and have no attestation, so `harness mutants`
      # generates their SBOMs with syft on both sides (HARNESS_SBOM_SOURCE=generate). Without syft added-package escapes.
      # `download-syft` takes the tag with its `v` (syft-version) and prints the path of the binary as `cmd`.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Point the harness at the downloaded syft
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: echo "HARNESS_SBOM_CMD=${SYFT_CMD} docker:{image} -o spdx-json" >> "$GITHUB_ENV"

      # The `vulns` artefact: each image's SBOM, scanned by grype (informational here: without HARNESS_REQUIRE_STATIC a scan that cannot run is 'not collected', not a failure).
      # Grype is pinned, and so is its database: fetched ONCE, here, into HARNESS_VULN_DB_DIR, restored from a cache with one
      # entry per UTC day and grype version, and never updated during the run (the harness switches every scanner update off).
      # Both sides of every comparison are scanned with the same database (docs/images.md, "The vulnerability database").
      # download-grype takes the tag with its `v` and prints the absolute path of the binary as `cmd`; it is not on PATH.
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
      - name: Put the pinned grype on PATH
        # Through env, not expanded into the script: an output is data, never code.
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: dirname "$GRYPE_CMD" >> "$GITHUB_PATH"

      - name: Which day's vulnerability database
        id: vulndb
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # An earlier day's entry (restore-keys) is still one database for the whole run, and better than none when grype's
      # servers are down; grype itself refuses one older than HARNESS_VULN_DB_MAX_AGE_DAYS (default 5).
      - name: Restore the vulnerability database
        id: vulndb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
          restore-keys: |
            vuln-db-grype-${{ env.GRYPE_VERSION }}-
      - name: Fetch the vulnerability database once (a cache miss only)
        id: vulndb-fetch
        if: steps.vulndb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm harness vuln-db update
      - name: Keep today's vulnerability database for the other runs
        if: steps.vulndb-fetch.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
      # The database this run judges with: schema, build time, age, checksum. Exit 0 even when it is unusable: nothing in this job needs it.
      - name: The vulnerability database this run judges with
        run: pnpm harness vuln-db status

      - name: Pull and verify, or build, the base images
        run: pnpm harness images ensure --a "$TAG" --b "$TAG"

      - name: Every mutant, caught and attributed
        run: pnpm harness mutants --base "$TAG"

      # When the A/A on the base is not clean the log lists the hunks (src/mutants.ts), and this small artifact carries the
      # report itself, so the failure can be read without downloading every mutant's screenshots. Reports and captures only.
      - name: Upload the A/A report of a failed self-test
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-noise-report
          path: |
            out/*-noise/report.md
            out/*-noise/report.json
            out/*-noise/report.html
            out/*-noise/noise-status.json
            out/*-noise/*/capture.json
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutant-reports
          path: out/
          retention-days: 14

      # The self-test's result in one small file (`harness mutants` writes out/mutants.json whatever happened), for the
      # scoreboard's "mutants caught per week" (the record job below).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-summary
          path: out/mutants.json
          retention-days: 14
          if-no-files-found: ignore

      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}

  # The harness's own health beside the release trends: this week's mutants caught, appended to scoreboard/mutants.jsonl on the
  # `scoreboard` branch (the one release.yml appends release lines to). Scheduled and dispatched runs only: a pull request's
  # re-run is a check on that PR, not a week of the harness. One commit per self-test, never forced.
  record:
    name: Record the week's mutants on the scoreboard
    needs: mutants
    if: always() && github.event_name != 'pull_request' && needs.mutants.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes this repository's `scoreboard` branch and nothing else.
      contents: write
    concurrency:
      group: scoreboard-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: harness
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: harness/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mutants-summary
          path: summary
      - name: Append the self-test to the scoreboard branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f summary/mutants.json ]; then echo "the self-test wrote no mutants.json (it stopped before the A/A): nothing to record"; exit 0; fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code --heads "$remote" scoreboard > /dev/null 2>&1; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone -q --depth 1 --branch scoreboard "$remote" publish
          else
            git init -q -b scoreboard publish
          fi
          mkdir -p publish/scoreboard
          touch publish/scoreboard/mutants.jsonl
          cp publish/scoreboard/mutants.jsonl before.jsonl
          (cd harness && pnpm harness scoreboard mutants --run ../summary/mutants.json --file ../publish/scoreboard/mutants.jsonl --run-url "$RUN_URL")
          head -c "$(wc -c < before.jsonl)" publish/scoreboard/mutants.jsonl | cmp -s - before.jsonl || { echo "the mutants record would lose or change a line: refusing to push" >&2; exit 1; }
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard/mutants.jsonl
          if git diff --cached --quiet; then echo "this self-test is already recorded"; exit 0; fi
          git commit -q -m "scoreboard: mutants $(date -u +%Y-%m-%d)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push "https://github.com/${GITHUB_REPOSITORY}.git" scoreboard

  required:
    name: Mutants re-run (required)
    needs: [changes, mutants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHANGES: ${{ needs.changes.result }}
      MUTANTS: ${{ needs.mutants.result }}
    steps:
      - run: |
          echo "changes: $CHANGES, mutants: $MUTANTS"
          [ "$CHANGES" = "success" ] || { echo "engine change without a version bump, or the check itself failed" >&2; exit 1; }
          [ "$MUTANTS" = "success" ] || [ "$MUTANTS" = "skipped" ] || { echo "the mutants did not pass" >&2; exit 1; }
