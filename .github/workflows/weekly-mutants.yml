# The harness's own signal: every planted regression must be caught and
# attributed. A harness that cannot catch its own mutants has no business
# gating a release.
name: Weekly mutants

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Base tag to plant mutants on"
        required: false

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      # Empty means the default: the monorepo's image-build.yml workflow (src/images.ts).
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY }}
      TAG: ${{ inputs.tag || vars.HARNESS_PRODUCTION_TAG || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Pull and verify, or build, the base images
        run: pnpm harness images ensure --a "$TAG" --b "$TAG"

      - name: Six mutants, all caught
        run: pnpm harness mutants --base "$TAG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutant-reports
          path: out/
          retention-days: 14
