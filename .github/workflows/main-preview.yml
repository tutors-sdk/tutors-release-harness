# Main to RC: what release mode would say if the monorepo's main were cut as a
# release candidate today. A forecast, not a gate: nothing is tagged, recorded or
# deployed, and a FAIL does not fail the run.
#
#   side a   production: the reader overlay's newTag on the monorepo's main, the
#            same tag release-dispatch.yml would put on side a
#   side b   sha-<short> of the newest commit on main whose image-build.yml push
#            run succeeded (so its images are signed; the :main tag is pushed
#            before it is signed and cannot be trusted mid-build)
#   claims   release/claims.yaml at that commit: the next release's claims so far
#
# The same release job as release.yml (5 runs, k6 20x30s, the pinned vulnerability
# database, the noise status), so its verdict is the one the release candidate
# would get today. Each unclaimed diff is a claim, or a fix, the next release needs.
# Since 1.13.1 the forecast is scored as a candidate is (docs/lean.md): the same two
# rehearsals as release.yml (migration, upgrade), then, after every verdict and never
# an input to one, what changed between production and main (harness changes:
# changes.json) and the Release Confidence Score, its band and the reviewer's glance
# (harness confidence: confidence.json). The report, its scorecard, confidence.json
# and changes.json are kept on the `main-preview` branch (reports/index.json, newest
# first), the kept report led by the Gate, the RCS and its band, the glance and the
# change risk per PR as `harness release` leads its own, for the report pages
# (site/index.html shows the newest as "What main would ship today"), the Release Hub
# and anyone else to read.
# A commit already judged by this harness version is skipped: a quiet day is one
# API call. `harness preview resolve` (src/ci/main-preview.ts) decides what to judge; docs/contract.md, "Main to RC".
name: Main to RC

on:
  # Straight after the nightly A/A, so the run finds tonight's noise status whenever the nightly finishes (it used to
  # be a cron two hours later, which a slow night could overtake). No cron fallback: a night with no A/A has no fresh
  # status to judge with, and a skipped forecast is one API call once the nightly is back. The name must be the
  # nightly's `name:` exactly (tests/main-preview.test.ts holds it to that).
  workflow_run:
    workflows: ["Nightly noise (A/A)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      production:
        description: "Side a (default: the reader overlay's newTag on the monorepo's main)"
        required: false
      candidate:
        description: "Side b (default: sha-<short> of the newest commit on main with signed images)"
        required: false
      force:
        description: "Judge again even when this pair was already judged by this harness version"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: main-preview
  cancel-in-progress: false

jobs:
  resolve:
    name: What main would ship
    # After a nightly, only one that ran this repository's main and finished (passed or failed: the gate reads the
    # status it left, or the last one, and says which). Nothing of the triggering run is checked out or downloaded:
    # only its branch, repository and conclusion are read, so the workflow_run trigger runs no untrusted code.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production: ${{ steps.resolve.outputs.production }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      sha: ${{ steps.resolve.outputs.sha }}
      claims_url: ${{ steps.resolve.outputs.claims_url }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve production and main's images
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION: ${{ inputs.production }}
          CANDIDATE: ${{ inputs.candidate }}
          FORCE: ${{ inputs.force }}
        run: |
          force=""; if [ "$FORCE" = true ]; then force="--force"; fi
          pnpm harness preview resolve ${PRODUCTION:+--a "$PRODUCTION"} ${CANDIDATE:+--b "$CANDIDATE"} ${force:+"$force"}

  preview:
    name: Release mode, main as the candidate
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    # The runner image the nightly A/A calibrated the noise floor on, as release.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
      PRODUCTION: ${{ needs.resolve.outputs.production }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
      SHA: ${{ needs.resolve.outputs.sha }}
      CLAIMS_URL: ${{ needs.resolve.outputs.claims_url }}
      GRYPE_VERSION: v0.119.0
      HARNESS_VULN_DB_DIR: ${{ github.workspace }}/.harness/vuln-db
      # As release.yml: the forecast is only worth having if it is judged as the candidate would be.
      HARNESS_REQUIRE_STATIC: "1"
      # What the apps load from Google Fonts, Iconify and jsDelivr, as recorded once (src/collectors/third-party-cache.ts): the
      # default of a local run is HARNESS_HOME/third-party-cache, the same place.
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The browser is answered from one recorded copy of what the apps load from Google Fonts, Iconify and jsDelivr: the same
      # bytes on both sides, at once, so a font or an icon cannot arrive on one side only, and an outage of those hosts breaks
      # nothing (docs/noise-burndown.md). The key never matches exactly; restore-keys picks the newest entry.
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
      - name: Put the pinned grype on PATH
        # Through env, not expanded into the script: an output is data, never code. zizmor's github-env flags any PATH
        # write under workflow_run; this one is the directory of the grype the pinned action above just downloaded in
        # this job, and nothing of the triggering run reaches it.
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: dirname "$GRYPE_CMD" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
      - name: Which day's vulnerability database
        id: vulndb
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the vulnerability database
        id: vulndb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
          restore-keys: |
            vuln-db-grype-${{ env.GRYPE_VERSION }}-
      - name: Fetch the vulnerability database once (a cache miss only)
        id: vulndb-fetch
        if: steps.vulndb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm harness vuln-db update
      - name: Keep today's vulnerability database for the other runs
        if: steps.vulndb-fetch.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
      - name: The vulnerability database this run judges with
        run: pnpm harness vuln-db status

      - name: Pull and verify both sides
        run: pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE"

      # The next release's claims so far. A claim that names a Rule needs the Rules main defines, built the way
      # release-dispatch.yml builds them (pnpm release:rules at the commit); best effort, as there.
      - name: Fetch main's claims
        run: curl -fsSL "$CLAIMS_URL" -o claims.yaml
      - name: Check out the monorepo at that commit, for its Rules
        if: env.SHA != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tutors-sdk/tutors-mono-repo
          ref: ${{ env.SHA }}
          path: monorepo
          persist-credentials: false
      - name: Main's Rules
        if: env.SHA != ''
        continue-on-error: true
        working-directory: monorepo
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter .
          pnpm --silent release:rules --ref "$SHA" --out ../rules.json

      - name: Fetch the latest noise status
        id: noise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p noise
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/noise-status.json?ref=noise" > noise/noise-status.json 2>/dev/null || rm -f noise/noise-status.json
          pnpm harness noise status --store noise

      # A verdict, PASS, WARN or FAIL, is the forecast and the job succeeds; only "could not judge" (exit 2) fails it.
      - name: Release mode
        env:
          NOISE_FILE: ${{ steps.noise.outputs.noise_file }}
        run: |
          rules=""; if [ -s rules.json ]; then rules=rules.json; fi
          set +e
          pnpm harness run --mode release --a "$PRODUCTION" --b "$CANDIDATE" --runs 5 --load 20x30s \
            --claims claims.yaml ${rules:+--rules "$rules"} ${NOISE_FILE:+--noise "$NOISE_FILE"}
          code=$?
          set -e
          if [ -f rules.json ]; then mkdir -p out && cp rules.json out/rules.json; fi
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: main-preview-report
          path: out/
          retention-days: 14

      - name: Show the report
        if: always()
        run: |
          if ls out/*-release/report.md > /dev/null 2>&1; then
            { echo "### Main (${CANDIDATE}) as a release candidate against production ${PRODUCTION}"; echo; cat out/*-release/report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Main to RC: could not judge (no report: the run stopped before a verdict, see the step log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}

  # The two rehearsals release.yml gives a candidate, so the score's Rehearsals dimension is measured, not a skip that
  # breaches its floor every morning. Main's migrations are the judged commit's (a candidate given by hand: v<candidate>).
  # As with release mode, a FAIL is a forecast; only exit 2 (could not judge) fails the job.
  migration:
    name: Migration rehearsal, main as the candidate
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION: ${{ needs.resolve.outputs.production }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration mode
        run: |
          set +e
          pnpm harness run --mode migration --a "v$PRODUCTION" --b "${SHA:-v$CANDIDATE}"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: main-preview-migration-report
          path: out/
          retention-days: 14

  upgrade:
    name: Upgrade rehearsal, main as the candidate
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
      PRODUCTION: ${{ needs.resolve.outputs.production }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # As in the preview job (and release.yml's upgrade job): the same recorded bytes on both sides.
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Pull and verify both sides
        run: pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE"
      - name: Upgrade mode
        run: |
          set +e
          pnpm harness run --mode upgrade --a "$PRODUCTION" --b "$CANDIDATE" --set fixture --journey anonymous-student-reads-course
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: main-preview-upgrade-report
          path: out/
          retention-days: 14

      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}

  # The forecast, readable at a raw URL after the artifact has expired: reports/index.json and each run's report and
  # scorecard, on the `main-preview` branch, and since 1.16.0 its two rehearsals beside it. One commit per run, never
  # forced; the last 60 runs are kept, and every run of the last 10 days whatever the count. Before it is
  # kept it is scored, as release.yml's scoreboard job scores a candidate: advisory, after every verdict, and nothing
  # here reaches one. A step that cannot run says why and the forecast is kept without it.
  publish:
    name: Keep the forecast
    needs: [resolve, preview, migration, upgrade]
    if: always() && needs.preview.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes this repository's `main-preview` branch and nothing else.
      contents: write
    concurrency:
      group: main-preview-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: harness
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: harness/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: main-preview-report
          path: reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: main-preview-migration-report
          path: rehearsals/migration
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: main-preview-upgrade-report
          path: rehearsals/upgrade
      # Change risk: the monorepo's history from production's tag to the commit judged (public; read-only). A candidate
      # given by hand has no commit, and without the history change risk is "not measured", never assumed clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        with:
          repository: tutors-sdk/tutors-mono-repo
          persist-credentials: false
          fetch-depth: 0
          path: mono
      - name: What changed between production and main
        if: needs.resolve.outputs.sha != ''
        continue-on-error: true
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION: ${{ needs.resolve.outputs.production }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          report="$(find ../reports -path '*-release/report.json' 2>/dev/null | head -1)"
          if [ -z "$report" ]; then echo "no release report: nothing to put changes beside"; exit 0; fi
          pnpm harness changes --a "$PRODUCTION" --b "$SHA" --monorepo ../mono --out "$(dirname "$report")/changes.json"
      # The score, its band and the reviewer's glance, beside the release run (confidence.json), from the release run, the
      # rehearsals and changes.json. The glance's novelty reads the release scoreboard (the `scoreboard` branch, read only).
      - name: Score the forecast
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$(find reports -path '*-release/report.json' 2>/dev/null | head -1)"
          if [ -z "$report" ]; then echo "no release report: nothing to score"; exit 0; fi
          run_dir="$PWD/$(dirname "$report")"
          migration="$(find rehearsals/migration -path '*-migration/report.json' 2>/dev/null | head -1)"
          upgrade="$(find rehearsals/upgrade -path '*-upgrade/report.json' 2>/dev/null | head -1)"
          score=(--run "$run_dir")
          if [ -n "$migration" ]; then score+=(--migration "$PWD/$(dirname "$migration")"); fi
          if [ -n "$upgrade" ]; then score+=(--upgrade "$PWD/$(dirname "$upgrade")"); fi
          if [ -f "$run_dir/changes.json" ]; then score+=(--change-risk "$run_dir/changes.json"); fi
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/scoreboard/releases.jsonl?ref=scoreboard" > scoreboard.jsonl 2>/dev/null || rm -f scoreboard.jsonl
          if [ -s scoreboard.jsonl ]; then score+=(--scoreboard "$PWD/scoreboard.jsonl"); fi
          (cd harness && pnpm harness confidence "${score[@]}")
          jq -r '"### Main to RC, scored", "", "**Gate: \(.gate)** · " + (if .rcs == null then (.note // "no RCS") else "RCS \(.rcs) \(.band): \(.meaning)" end) + " · the glance: \(.glance | length) place(s) to look"' "$run_dir/confidence.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the report to the main-preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRODUCTION: ${{ needs.resolve.outputs.production }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          report="$(find reports -path '*-release/report.json' 2>/dev/null | head -1)"
          if [ -z "$report" ]; then echo "no report was written (release mode did not reach a verdict): nothing to keep"; exit 0; fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code --heads "$remote" main-preview > /dev/null 2>&1; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone -q --depth 1 --branch main-preview "$remote" publish
          else
            git init -q -b main-preview publish
          fi
          keep_flags=()
          if [ -f reports/rules.json ]; then keep_flags=(--rules ../reports/rules.json); fi
          # The rehearsals the score read, kept beside the forecast (the artifact expires): the kept confidence.json links
          # them there instead of this runner's rehearsals/ directory.
          migration="$(find rehearsals/migration -path '*-migration/report.json' 2>/dev/null | head -1)"
          upgrade="$(find rehearsals/upgrade -path '*-upgrade/report.json' 2>/dev/null | head -1)"
          if [ -n "$migration" ]; then keep_flags+=(--migration "../$(dirname "$migration")"); fi
          if [ -n "$upgrade" ]; then keep_flags+=(--upgrade "../$(dirname "$upgrade")"); fi
          (cd harness && pnpm harness reports keep --dir "../$(dirname "$report")" --store ../publish --run-url "$RUN_URL" --keep-last 60 --keep-days 10 "${keep_flags[@]}")
          cat > publish/README.md <<'README'
          # main-preview

          Written by `.github/workflows/main-preview.yml` ("Main to RC"), one commit per run. Do not edit.

          Each run is release mode with production on side a and the monorepo's main (`sha-<short>`) on side b, judged
          against main's `release/claims.yaml`: what the next release candidate would get if it were cut today. A
          forecast, never a gate or a release record.

          - `reports/index.json`: the last 60 runs, and every run of the last 10 days, newest first, each with its
            verdict and scorecard headline, and (since harness 1.13.1) the Gate, the RCS and its band, the glance and
            the change risk.
          - `reports/<ranAt>-release/report.{json,md,html}` and `scorecard.{json,md}` for each; since 1.13.1 also
            `confidence.json` and `changes.json`, with report.md and report.html led by the Gate, the RCS and its
            band, the reviewer's glance and the change risk per PR, as `harness release` leads its report; since
            1.16.0 also `migration/` and `upgrade/`, the two rehearsals' reports, which `confidence.json` links.

          See `docs/contract.md`, "Main to RC", on the default branch.
