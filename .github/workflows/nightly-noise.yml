# Nightly A/A on the production tag, pulled from the registry onto the CI
# runner (never image-against-itself on a laptop): five runs, the noise count
# tracked over time, the status published where release runs can find it.
#
# A diff here is noise the normaliser must learn to mask, or non-determinism in
# the stack; docs/noise-burndown.md is the playbook. The ratchet: the count
# reaches 0 and stays there.
#
# Two jobs:
#   noise    — read-only. Pulls and verifies the production images (or, when the
#              registry cannot answer, falls back to last night's verified images
#              from the runner cache, and the night is DEGRADED), runs the A/A
#              with --require-verified, uploads the status and the report.
#   publish  — the only job with a write permission, and only to this repository's
#              `noise` branch: appends tonight to the history, prints the ratchet to
#              the run summary, publishes noise-status.json to the branch so that
#              release.yml and post-deploy.yml can fetch the latest one, and fails
#              when the ratchet is broken.
name: Nightly noise (A/A)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Production tag to compare with itself"
        required: false

permissions:
  contents: read

concurrency:
  group: nightly-noise
  cancel-in-progress: false

jobs:
  noise:
    # Pinned, not ubuntu-latest: the A/A measures the noise floor of THIS runner image (fonts, anti-aliasing,
    # timing), and release.yml and post-deploy.yml run on the same one. Move all three together, in one PR,
    # and expect a fresh burn-down after (docs/noise-burndown.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      # Who must have signed a pulled image: the monorepo's image-build.yml workflow (docs/contract.md).
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
      TAG: ${{ inputs.tag || vars.HARNESS_PRODUCTION_TAG || 'main' }}
      # grype, pinned: the version download-grype installs, and part of the database cache key.
      GRYPE_VERSION: v0.119.0
      # The one directory every scan reads: the default of a local run is HARNESS_HOME/vuln-db, the same place (docs/local.md).
      HARNESS_VULN_DB_DIR: ${{ github.workspace }}/.harness/vuln-db
      # Required, because this is the canary: an image whose manifest, SBOM or vulnerabilities cannot be collected makes the night
      # not clean, so a scanner that has silently stopped working is found here, on the production tag, and not during a release.
      # A degraded night (registry down) is already not counted. Rationale: docs/images.md, "The vulnerability database".
      HARNESS_REQUIRE_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@v4.1.2

      # The `vulns` artefact: each image's SBOM, scanned by grype (HARNESS_REQUIRE_STATIC=1: no database, no scan, no pass).
      # Grype is pinned, and so is its database: fetched ONCE, here, into HARNESS_VULN_DB_DIR, restored from a cache with one
      # entry per UTC day and grype version, and never updated during the run (the harness switches every scanner update off).
      # Both sides of every comparison are scanned with the same database (docs/images.md, "The vulnerability database").
      # download-grype takes the tag with its `v` and prints the absolute path of the binary as `cmd`; it is not on PATH.
      - uses: anchore/scan-action/download-grype@v7.4.2
        id: grype
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
      - name: Put the pinned grype on PATH
        run: dirname "${{ steps.grype.outputs.cmd }}" >> "$GITHUB_PATH"

      - name: Which day's vulnerability database
        id: vulndb
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # An earlier day's entry (restore-keys) is still one database for the whole run, and better than none when grype's
      # servers are down; grype itself refuses one older than HARNESS_VULN_DB_MAX_AGE_DAYS (default 5).
      - name: Restore the vulnerability database
        id: vulndb-cache
        uses: actions/cache/restore@v4
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
          restore-keys: |
            vuln-db-grype-${{ env.GRYPE_VERSION }}-
      - name: Fetch the vulnerability database once (a cache miss only)
        id: vulndb-fetch
        if: steps.vulndb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm harness vuln-db update
      - name: Keep today's vulnerability database for the other runs
        if: steps.vulndb-fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
      # The database this run judges with: schema, build time, age, checksum. Exit 1 when it is unusable, because HARNESS_REQUIRE_STATIC is set.
      - name: The vulnerability database this run judges with
        run: pnpm harness vuln-db status

      # Last night's verified production images, for a night the registry is down or rate-limiting.
      # The key never matches exactly (it ends in this run's id); restore-keys picks the newest earlier one.
      - name: Restore the last verified production images
        uses: actions/cache/restore@v4
        with:
          path: .harness/image-cache
          key: production-images-${{ env.TAG }}-${{ github.run_id }}
          restore-keys: |
            production-images-${{ env.TAG }}-

      # The registry is always asked first: the cache is used only when it cannot answer, and a night that
      # used it (or built from source) is DEGRADED: it neither counts as clean nor licenses a release FAIL.
      - name: Pull and verify the production images
        id: ensure
        run: pnpm harness images ensure --a "$TAG" --b "$TAG" --image-cache .harness/image-cache

      - name: Keep the verified images for a night the registry is down
        if: steps.ensure.outputs.image_cache == 'refreshed'
        uses: actions/cache/save@v4
        with:
          path: .harness/image-cache
          key: production-images-${{ env.TAG }}-${{ github.run_id }}

      # --load makes the A/A exercise the same k6 comparison a release run does (release.yml passes the same
      # 20x30s), so its noise is calibrated here, not discovered on a release.
      - name: A/A, five runs, with load
        run: pnpm harness run --mode noise --a "$TAG" --b "$TAG" --runs 5 --load 20x30s --require-verified

      - name: Show the A/A report
        if: always()
        run: |
          if ls out/*-noise/report.md > /dev/null 2>&1; then cat out/*-noise/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "### A/A: could not judge (no report: the run stopped before a verdict, see the step log)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish the noise status for release runs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-status
          path: out/*/noise-status.json
          retention-days: 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-report
          path: out/
          retention-days: 8

  publish:
    name: Publish the noise status and check the ratchet
    needs: noise
    # Only when the A/A produced a status: a night that never got that far leaves the last one to age out.
    if: needs.noise.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes this repository's `noise` branch and nothing else. No token for any other repository, and none of
      # the pull-request, check, status or deployment permissions the contract rules out.
      contents: write
    concurrency:
      group: noise-branch
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || vars.HARNESS_PRODUCTION_TAG || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: noise-report
          path: tonight

      - name: The history so far, from the noise branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p publish
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/noise-history.json?ref=noise" > publish/noise-history.json 2>/dev/null \
            || { echo "no noise branch yet: starting the history"; rm -f publish/noise-history.json; }

      # Exit 1 means the ratchet is broken. It is reported after publishing, so the status that says so still reaches the branch.
      - name: Record tonight and check the ratchet
        id: record
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status="$(ls tonight/*/noise-status.json | head -1)"
          report="$(ls tonight/*/report.json | head -1)"
          pnpm harness noise record \
            --status "$status" --report "$report" --store publish \
            --tag "$TAG" --run-url "$RUN_URL" --summary "$GITHUB_STEP_SUMMARY"

      # One commit, forced, every night: the history lives in noise-history.json, not in git, so the branch never grows
      # and nothing can conflict. Release runs read noise-status.json from here (docs/noise-burndown.md).
      - name: Publish to the noise branch
        if: steps.record.outcome != 'skipped' && hashFiles('publish/noise-status.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          cat > README.md <<'README'
          # noise

          Written by `.github/workflows/nightly-noise.yml`, force-pushed every night. Do not edit.

          - `noise-status.json`: the latest A/A result. `release.yml` and `post-deploy.yml` read it; the gate may FAIL a release only while it is clean, verified and no more than seven days old.
          - `noise-history.json`: one entry per night, for the ratchet.
          - `noise-summary.md`: tonight's summary.

          See `docs/noise-burndown.md` on the default branch.
          README
          git init -q -b noise
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md noise-status.json noise-history.json noise-summary.md
          git commit -q -m "noise: A/A status $(date -u +%Y-%m-%d)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --force "https://github.com/${GITHUB_REPOSITORY}.git" noise

      - name: Fail the night when the ratchet is broken
        if: steps.record.outcome == 'failure'
        run: |
          echo "the record step failed: the noise ratchet is broken (the count had reached 0 and is not 0 tonight), or tonight's status was unusable; see the summary and the step log" >&2
          exit 1
