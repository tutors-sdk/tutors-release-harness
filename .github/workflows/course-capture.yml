# Course capture against a real course (docs/course-capture.md): `harness course capture` reads a live, public Tutors
# course the way the reader does and writes it to disk, pinned by sha256. The unit tests use a fake web and the
# committed fixture course; this is the run that proves the command against tutors.dev itself.
#
# Two jobs. `capture` takes one course (on demand: any course, any depth) and verifies the capture. `corpus` (since
# 1.30.0) captures the curated corpus (fixtures/course-corpus/courses.yaml, at most five courses), boots the stack and
# checks every corpus course loads: its files served as captured, and a sample of its pages showing their titles in
# Chromium (harness course check). Since 1.31.0 it boots production on side a and main on side b, as Main to RC does
# (harness preview resolve), checks the corpus in both readers, and the A3 shows the two side by side (pages.yml reads
# the newest course-corpus-check artifact of main into the site's courses/).
#
# `capture` runs on demand, weekly, and on a pull request that changes src/course/ or the corpus; `corpus` the same and,
# since 1.32.0, straight after each Main to RC on main, so the courses are checked on the same main the forecast judged
# (both resolve main's newest built images). Since 1.32.0 each page is read as a student meets it and a few journeys
# are clicked through (harness course check), and the A3 compares production and main page by page. Advisory: the A3
# reads its result, never the Gate, and a course that moved or went private fails only this run.
name: Course capture

on:
  workflow_dispatch:
    inputs:
      course:
        description: "The course: https://tutors.dev/course/<id> or the id"
        required: false
        default: "https://tutors.dev/course/wit-hdip-comp-sci-2024"
      depth:
        description: "Levels of linked courses to follow (0 is the course alone)"
        required: false
        default: "1"
  schedule:
    - cron: "17 5 * * 3"
  # Since 1.32.0: after every Main to RC, so the A3 reads production and main on real courses beside the forecast.
  # Only the triggering run's branch, repository and conclusion are read (.github/zizmor.yml).
  workflow_run:
    workflows: ["Main to RC"]
    types: [completed]
  pull_request:
    paths:
      - "src/course/**"
      - "fixtures/course-corpus/**"
      - ".github/workflows/course-capture.yml"

permissions:
  contents: read

concurrency:
  group: course-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture a live course
    if: github.event_name != 'workflow_run' && (github.event_name != 'schedule' || github.event.schedule == '17 5 * * 3')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COURSE: ${{ inputs.course || 'https://tutors.dev/course/wit-hdip-comp-sci-2024' }}
      DEPTH: ${{ inputs.depth || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Media can be large and the manifests are what is kept, so videos and files over 50 MB are recorded, not fetched.
      - name: Capture
        run: pnpm harness course capture --course "$COURSE" --depth "$DEPTH" --out "$RUNNER_TEMP/capture" --skip-ext mp4,mov --max-file-mb 50
      - name: Verify
        run: pnpm harness course verify --dir "$RUNNER_TEMP/capture"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Course capture: $COURSE (depth $DEPTH)"
            echo '```'
            jq -r '.courses[] | "\(.status)\t\(.id)\t\(.files // "-") files\t\(.bytes // "-") bytes\t\(.missing // "-") missing\t\(.skipped // "-") skipped"' "$RUNNER_TEMP/capture/courses.json" 2>/dev/null || echo "no courses.json"
            echo '```'
            echo "Total on disk: $(du -sh "$RUNNER_TEMP/capture" 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the manifests
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/manifests"
          cd "$RUNNER_TEMP/capture" && find . \( -name courses.json -o -name course-capture.json \) -exec cp --parents {} "$RUNNER_TEMP/manifests/" \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: course-capture
          path: ${{ runner.temp }}/manifests
          if-no-files-found: warn
          retention-days: 14

  corpus:
    name: The course corpus loads in the reader
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-24.04
    # Five courses, 40 pages and 2 journeys each, read with axe in two readers: about 400 page reads.
    timeout-minutes: 75
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      # Who must have signed a pulled image: the monorepo's image-build.yml workflow (docs/contract.md).
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
      HARNESS_COMPOSE_PROJECT: tutors-harness
      # What the apps load from Google Fonts, Iconify and jsDelivr, as every job that installs Chromium has it (ci.yml).
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Capture the corpus
        run: pnpm harness course capture --corpus fixtures/course-corpus/courses.yaml --out "$RUNNER_TEMP/corpus"
      # Since 1.31.0: production (the reader overlay's tag on the monorepo's main) and main's newest built images, as
      # Main to RC resolves them. --force: this job checks the pair whether or not a forecast has judged it.
      - name: Production and main's images
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm harness preview resolve --force
      - name: Pull and verify the images, and boot the stack
        env:
          PRODUCTION: ${{ steps.resolve.outputs.production }}
          CANDIDATE: ${{ steps.resolve.outputs.candidate }}
        run: |
          pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE"
          pnpm harness stack up --a "$PRODUCTION" --b "$CANDIDATE"
      # Every page of the reader renders in the browser, so only a browser shows a course loading. Production's reader
      # (side a, 3100) then main's (side b, 3200); each side's course-check.json goes under checks/<side>/<course>/.
      - name: Every corpus course loads, in production's reader and main's
        env:
          PRODUCTION: ${{ steps.resolve.outputs.production }}
          CANDIDATE: ${{ steps.resolve.outputs.candidate }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          status=0
          for side in a b; do
            port=3100; if [ "$side" = b ]; then port=3200; fi
            pnpm harness course check --corpus fixtures/course-corpus/courses.yaml --dir "$RUNNER_TEMP/corpus" --reader "http://localhost:$port" --sample 40 --journeys 2 || status=1
            for f in "$RUNNER_TEMP"/corpus/*/course-check.json; do
              [ -f "$f" ] || continue
              course="$(basename "$(dirname "$f")")"
              mkdir -p "$RUNNER_TEMP/checks/$side/$course" && mv "$f" "$RUNNER_TEMP/checks/$side/$course/"
            done
          done
          jq -n --arg production "$PRODUCTION" --arg candidate "$CANDIDATE" --arg sha "$SHA" --arg at "$(date -u +%FT%TZ)" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{production: $production, candidate: $candidate, sha: $sha, checkedAt: $at, runUrl: $url}' > "$RUNNER_TEMP/checks/sides.json"
          exit "$status"
      - name: Summary
        if: always()
        env:
          PRODUCTION: ${{ steps.resolve.outputs.production }}
          CANDIDATE: ${{ steps.resolve.outputs.candidate }}
        run: |
          {
            echo "### Course corpus: production $PRODUCTION (a) and main $CANDIDATE (b)"
            echo '```'
            for f in "$RUNNER_TEMP"/checks/*/*/course-check.json; do
              side="$(basename "$(dirname "$(dirname "$f")")")"
              [ -f "$f" ] && jq -r --arg side "$side" '"\($side) \(.course.id): files \(.files.checked - (.files.problems|length))/\(.files.checked); pages \(.pages.ok // "-")/\(.pages.sampled // "-") (median \(.pages.medianMs // "-") ms, max \(.pages.maxMs // "-") ms); journeys \([.journeys[]? | select(.ok)] | length)/\(.journeys // [] | length)"' "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p "$HARNESS_COMPOSE_PROJECT" -f compose.harness.yaml logs --no-color || true
      - name: Keep the checks
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          cd "$RUNNER_TEMP/corpus" && find . \( -name courses.json -o -name course-capture.json \) -exec cp --parents {} "$RUNNER_TEMP/checks/" \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: course-corpus-check
          path: ${{ runner.temp }}/checks
          if-no-files-found: warn
          retention-days: 14
      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}
