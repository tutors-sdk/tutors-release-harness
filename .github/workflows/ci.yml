name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, lint, unit and fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Phase H0 exit criterion, kept running: any two tags boot side by side and
  # one journey runs against both. Images are pulled from Quay and their
  # signatures verified when the registry has the tag; otherwise they are built
  # from the monorepo ref, and the report header says so (docs/images.md).
  two-stacks:
    name: Two stacks boot and one journey runs (A/A)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      # Empty means the default: the monorepo's image-build.yml workflow (src/images.ts).
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY }}
      TAG: ${{ vars.HARNESS_PRODUCTION_TAG || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Pull and verify, or build, the images
        run: pnpm harness images ensure --a "$TAG" --b "$TAG"

      - name: A/A on one journey
        run: pnpm harness run --mode noise --a "$TAG" --b "$TAG" --set fixture --journey anonymous-student-reads-course

      - name: Migration rehearsal fixtures (must pass, must fail)
        run: |
          pnpm harness run --mode migration --a dir:tests/fixtures/migrations/a --b dir:tests/fixtures/migrations/b-good
          if pnpm harness run --mode migration --a dir:tests/fixtures/migrations/a --b dir:tests/fixtures/migrations/b-bad; then
            echo "the contracting fixture was accepted" >&2; exit 1
          fi

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p tutors-harness -f compose.harness.yaml --profile upgrade logs --no-color || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-ci
          path: out/
          retention-days: 7
