name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, lint, unit and fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # A mask is a blind spot you chose: a PR that adds or loosens one changes nothing else (`harness guard masks`, src/ci/mask-change.ts),
  # and a mask list past ~40 is flagged. Always reports on a pull request, so it can be a required check.
  masks:
    name: Masks land in their own PR (required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Masks added or loosened, and nothing else changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm harness guard masks --base "$BASE_SHA"

  # Phase H0 exit criterion, kept running: any two tags boot side by side and
  # one journey runs against both. Images are pulled from Quay and their
  # signatures verified when the registry has the tag; otherwise they are built
  # from the monorepo ref, and the report header says so (docs/images.md).
  two-stacks:
    name: Two stacks boot and one journey runs (A/A)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
      # Who must have signed a pulled image: the monorepo's image-build.yml workflow (docs/contract.md).
      HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
      TAG: ${{ vars.HARNESS_PRODUCTION_TAG || 'main' }}
      # The compose project is otherwise derived from the checkout's path (src/project.ts). A runner has one checkout, so it
      # is pinned, and the logs step below can name it.
      HARNESS_COMPOSE_PROJECT: tutors-harness
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@v4.1.2

      # The whole smoke is one command, the one a maintainer runs locally (`pnpm smoke`, docs/local.md): pull and verify
      # or build the images, boot both stacks and run one journey A/A, then the migration fixtures (the expanding one must
      # pass, the contracting one must be rejected). the command's --dry-run prints the four steps.
      - name: Two stacks boot, one journey runs (A/A), migration fixtures pass and fail as they must
        run: pnpm harness local smoke --tag "$TAG"

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p "$HARNESS_COMPOSE_PROJECT" -f compose.harness.yaml --profile upgrade logs --no-color || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-ci
          path: out/
          retention-days: 7
