# Release gate: the candidate beside the production tag. Dispatched by the
# monorepo when a release branch is pushed (docs/monorepo/release-dispatch.yml)
# or run by hand.
#
# Three jobs, all against the same two tags:
#   release   — A/B with claims, 5 runs, k6; FAILS on an unclaimed diff only
#               when the latest nightly A/A (the `noise` branch, written by
#               nightly-noise.yml) is clean, verified and under seven days old;
#               with none, or a dirty, stale or degraded one, it WARNS
#   migration — the candidate's migrations on the production schema
#   upgrade   — the candidate rolled in under load through the edge
#
# Overriding a FAIL: dispatch by hand with override_reason. The verdict stays
# FAIL and the jobs exit 0, the report records the actor and the reason, and
# override-record opens a `harness-override` issue: the quarterly count of those
# is the measure of whether the harness is trusted or merely tolerated
# (docs/noise-burndown.md, "Overrides").
name: Release harness
# The run is titled for the candidate ("release 16.3.0-rc.4"), so the monorepo's release-harness-report workflow can
# find the run its dispatch started and put the verdict on the release pull request (docs/monorepo/README.md).
run-name: release ${{ github.event.client_payload.candidate || inputs.candidate }}

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Production tag (side a)"
        required: true
      candidate:
        description: "Candidate tag (side b)"
        required: true
      claims_url:
        description: "Raw URL of the release's claims.yaml (optional)"
        required: false
      rules_url:
        description: "Raw URL of the release's rules.json, the Rules a claim may name (optional; a claim that names a rule needs it)"
        required: false
      migrations_a:
        description: "Monorepo git ref for production's migrations (default v<production>)"
        required: false
      migrations_b:
        description: "Monorepo git ref for the candidate's migrations (default v<candidate>)"
        required: false
      runs:
        description: "Journey repetitions per side (at least 4 for timing to be judgeable at alpha 0.05; default 5)"
        required: false
        default: "5"
      override_reason:
        description: "Accept a harness FAIL, and say why (20+ characters). Recorded in the report and in a harness-override issue"
        required: false
  repository_dispatch:
    types: [release-candidate]

permissions:
  contents: read
  actions: read

env:
  HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
  # Who must have signed a pulled image: the monorepo's image-build.yml workflow (docs/contract.md).
  HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY || '^https://github.com/tutors-sdk/tutors-mono-repo/\.github/workflows/image-build\.yml@' }}
  PRODUCTION: ${{ inputs.production || github.event.client_payload.production }}
  CANDIDATE: ${{ inputs.candidate || github.event.client_payload.candidate }}
  CLAIMS_URL: ${{ inputs.claims_url || github.event.client_payload.claims_url }}
  RULES_URL: ${{ inputs.rules_url || github.event.client_payload.rules_url }}
  # Since 1.3.0, optional: the digest of each app's image, as JSON objects (app -> sha256:...). Empty for a dispatch without them.
  PRODUCTION_DIGESTS: ${{ github.event.client_payload.production_digests && toJSON(github.event.client_payload.production_digests) || '' }}
  CANDIDATE_DIGESTS: ${{ github.event.client_payload.candidate_digests && toJSON(github.event.client_payload.candidate_digests) || '' }}
  RUNS: ${{ inputs.runs || github.event.client_payload.runs || '5' }}
  # Only a person dispatching by hand can override; a repository_dispatch payload cannot.
  OVERRIDE_REASON: ${{ inputs.override_reason }}
  OVERRIDE_BY: ${{ github.triggering_actor }}

jobs:
  release:
    name: Release mode (A/B, claims, k6)
    # The runner image the nightly A/A calibrated the noise floor on (nightly-noise.yml pins the same one).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # grype, pinned: the version download-grype installs, and part of the database cache key.
      GRYPE_VERSION: v0.119.0
      # The one directory every scan reads: the default of a local run is HARNESS_HOME/vuln-db, the same place (docs/local.md).
      HARNESS_VULN_DB_DIR: ${{ github.workspace }}/.harness/vuln-db
      # Required: a release is not judged on an SBOM and vulnerability diff that could not be produced. The nightly runs the same
      # collection on the production tag every night, so a broken scanner is known before a release needs it; a FAIL a person
      # accepts anyway goes through override_reason. Rationale: docs/images.md, "The vulnerability database".
      HARNESS_REQUIRE_STATIC: "1"
      # What the apps load from Google Fonts, Iconify and jsDelivr, as recorded once (src/collectors/third-party-cache.ts): the
      # default of a local run is HARNESS_HOME/third-party-cache, the same place.
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The browser is answered from one recorded copy of what the apps load from Google Fonts, Iconify and jsDelivr: the same
      # bytes on both sides, at once, so a font or an icon cannot arrive on one side only, and an outage of those hosts breaks
      # nothing (docs/noise-burndown.md). The key never matches exactly; restore-keys picks the newest entry.
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The `vulns` artefact: each image's SBOM, scanned by grype (HARNESS_REQUIRE_STATIC=1: no database, no scan, no pass).
      # Grype is pinned, and so is its database: fetched ONCE, here, into HARNESS_VULN_DB_DIR, restored from a cache with one
      # entry per UTC day and grype version, and never updated during the run (the harness switches every scanner update off).
      # Both sides of every comparison are scanned with the same database (docs/images.md, "The vulnerability database").
      # download-grype takes the tag with its `v` and prints the absolute path of the binary as `cmd`; it is not on PATH.
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
      - name: Put the pinned grype on PATH
        # Through env, not expanded into the script: an output is data, never code.
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: dirname "$GRYPE_CMD" >> "$GITHUB_PATH"

      - name: Which day's vulnerability database
        id: vulndb
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # An earlier day's entry (restore-keys) is still one database for the whole run, and better than none when grype's
      # servers are down; grype itself refuses one older than HARNESS_VULN_DB_MAX_AGE_DAYS (default 5).
      - name: Restore the vulnerability database
        id: vulndb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
          restore-keys: |
            vuln-db-grype-${{ env.GRYPE_VERSION }}-
      - name: Fetch the vulnerability database once (a cache miss only)
        id: vulndb-fetch
        if: steps.vulndb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: pnpm harness vuln-db update
      - name: Keep today's vulnerability database for the other runs
        if: steps.vulndb-fetch.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/vuln-db
          key: vuln-db-grype-${{ env.GRYPE_VERSION }}-${{ steps.vulndb.outputs.day }}
      # The database this run judges with: schema, build time, age, checksum. Exit 1 when it is unusable, because HARNESS_REQUIRE_STATIC is set.
      - name: The vulnerability database this run judges with
        run: pnpm harness vuln-db status

      - name: Pull and verify, or build, both sides
        run: pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE" ${PRODUCTION_DIGESTS:+--a-digests "$PRODUCTION_DIGESTS"} ${CANDIDATE_DIGESTS:+--b-digests "$CANDIDATE_DIGESTS"}

      - name: Fetch the release's claims
        if: env.CLAIMS_URL != ''
        run: curl -fsSL "$CLAIMS_URL" -o claims.yaml

      # Since 1.23.0: the release's OpenVEX file, openvex.json beside claims.yaml, handed to the scanner (--vex). A
      # release that keeps none (a 404) runs without it, as before; one the harness cannot use is exit 2 at the run.
      - name: Fetch the release's OpenVEX file
        if: endsWith(env.CLAIMS_URL, '/claims.yaml')
        run: curl -fsSL "${CLAIMS_URL%claims.yaml}openvex.json" -o openvex.json || { rm -f openvex.json; echo "no openvex.json beside the claims, scanning without one"; }

      # The latest status the nightly published to the `noise` branch: the newest night, clean or not, never an older
      # clean one that a dirty night has since superseded. A missing or unusable file is dropped with a warning and the
      # run degrades to WARN; whether a present one is fresh, clean and verified enough to FAIL is decided by the gate.
      - name: Fetch the latest noise status
        id: noise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p noise
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/noise-status.json?ref=noise" > noise/noise-status.json 2>/dev/null || rm -f noise/noise-status.json
          pnpm harness noise status --store noise

      - name: Release mode
        env:
          NOISE_FILE: ${{ steps.noise.outputs.noise_file }}
        run: |
          vex=""; if [ -s openvex.json ]; then vex=openvex.json; fi
          pnpm harness run --mode release --a "$PRODUCTION" --b "$CANDIDATE" --runs "$RUNS" --load 20x30s \
            ${PRODUCTION_DIGESTS:+--a-digests "$PRODUCTION_DIGESTS"} ${CANDIDATE_DIGESTS:+--b-digests "$CANDIDATE_DIGESTS"} \
            ${CLAIMS_URL:+--claims claims.yaml} ${RULES_URL:+--rules "$RULES_URL"} ${vex:+--vex "$vex"} ${NOISE_FILE:+--noise "$NOISE_FILE"} \
            ${OVERRIDE_REASON:+--override-reason "$OVERRIDE_REASON" --override-by "$OVERRIDE_BY"}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-report
          path: out/
          retention-days: 30

      - name: Show the PR comment
        if: always()
        run: |
          if ls out/*-release/report.md > /dev/null 2>&1; then cat out/*-release/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "### Release mode: could not judge (no report: the run stopped before a verdict, see the step log)" >> "$GITHUB_STEP_SUMMARY"; fi

      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}

  migration:
    name: Migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATIONS_A: ${{ inputs.migrations_a || github.event.client_payload.migrations_a }}
      MIGRATIONS_B: ${{ inputs.migrations_b || github.event.client_payload.migrations_b }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration mode
        run: |
          pnpm harness run --mode migration --a "${MIGRATIONS_A:-v$PRODUCTION}" --b "${MIGRATIONS_B:-v$CANDIDATE}" \
            ${OVERRIDE_REASON:+--override-reason "$OVERRIDE_REASON" --override-by "$OVERRIDE_BY"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: migration-report
          path: out/
          retention-days: 30
      - if: always()
        run: |
          if ls out/*-migration/report.md > /dev/null 2>&1; then cat out/*-migration/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "### Migration rehearsal: could not judge (no report: the run stopped before a verdict, see the step log)" >> "$GITHUB_STEP_SUMMARY"; fi

  upgrade:
    name: Upgrade rehearsal (rollout under load)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What the apps load from Google Fonts, Iconify and jsDelivr, as recorded once (src/collectors/third-party-cache.ts): the
      # default of a local run is HARNESS_HOME/third-party-cache, the same place.
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The browser is answered from one recorded copy of what the apps load from Google Fonts, Iconify and jsDelivr: the same
      # bytes on both sides, at once, so a font or an icon cannot arrive on one side only, and an outage of those hosts breaks
      # nothing (docs/noise-burndown.md). The key never matches exactly; restore-keys picks the newest entry.
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Pull and verify, or build, both sides
        run: pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE" ${PRODUCTION_DIGESTS:+--a-digests "$PRODUCTION_DIGESTS"} ${CANDIDATE_DIGESTS:+--b-digests "$CANDIDATE_DIGESTS"}
      - name: Upgrade mode
        run: |
          pnpm harness run --mode upgrade --a "$PRODUCTION" --b "$CANDIDATE" --set fixture --journey anonymous-student-reads-course \
            ${PRODUCTION_DIGESTS:+--a-digests "$PRODUCTION_DIGESTS"} ${CANDIDATE_DIGESTS:+--b-digests "$CANDIDATE_DIGESTS"} \
            ${OVERRIDE_REASON:+--override-reason "$OVERRIDE_REASON" --override-by "$OVERRIDE_BY"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upgrade-report
          path: out/
          retention-days: 30
      - if: always()
        run: |
          if ls out/*-upgrade/report.md > /dev/null 2>&1; then cat out/*-upgrade/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "### Upgrade rehearsal: could not judge (no report: the run stopped before a verdict, see the step log)" >> "$GITHUB_STEP_SUMMARY"; fi

      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}

  # What release mode judged, for post-deploy mode to check a deployment against (docs/contract.md, "The release record").
  # Release mode wrote `release-record.json` into its output directory, so the release-report artifact carries it. This
  # pushes it to the `release-records` branch of THIS repository as releases/<candidate>.json and, when the candidate
  # could ship (not a FAIL, unless overridden), releases/<release>.json: what `--deployed <release>` finds. One commit
  # per candidate, never forced, so no record is lost; nothing else writes the branch.
  publish-record:
    name: Publish the release record
    needs: release
    # A run that never reached a verdict left no record: there is nothing to publish, and that is not an error.
    if: always() && needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes this repository's `release-records` branch and nothing else. None of the pull-request, check, status or
      # deployment permissions the contract rules out.
      contents: write
    concurrency:
      group: release-records-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: harness
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: harness/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-report
          path: reports
      - name: Push the record to the release-records branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          record="$(find reports -name release-record.json 2>/dev/null | head -1)"
          if [ -z "$record" ]; then echo "no release record was written (release mode did not reach a verdict): nothing to publish"; exit 0; fi
          candidate="$(jq -r .candidate "$record")"
          release="$(jq -r .release "$record")"
          shippable="$(jq -r 'if .verdict != "fail" or .overridden then "yes" else "no" end' "$record")"
          case "$candidate$release" in *[!A-Za-z0-9._-]*) echo "unsafe tag in the record: refusing to publish" >&2; exit 1;; esac
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code --heads "$remote" refs/heads/release-records > /dev/null 2>&1; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone -q --depth 1 --branch release-records "$remote" publish
          else
            git init -q -b release-records publish
          fi
          mkdir -p publish/releases
          cp "$record" "publish/releases/${candidate}.json"
          if [ "$shippable" = yes ] && [ "$release" != "$candidate" ]; then cp "$record" "publish/releases/${release}.json"; fi
          # The candidate's report beside its record, readable at a raw URL after the artifact has expired. Every candidate is kept.
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The release's rules.json, for the PRs a Rule names in the scorecard; without it the PRs come from claim reasons only.
          rules_flag=()
          if [ -n "$RULES_URL" ] && curl -fsSL --max-time 30 "$RULES_URL" -o rules.json; then rules_flag=(--rules ../rules.json); fi
          (cd harness && pnpm harness reports keep --dir "$(dirname "../$record")" --store ../publish --run-url "$run_url" "${rules_flag[@]}") \
            || echo "::warning title=Report not kept::the release record is published without its report; the artifact still has it"
          cat > publish/README.md <<'README'
          # release-records

          Written by the `publish-record` job of `.github/workflows/release.yml`, one commit per judged candidate. Do not edit.

          - `releases/<candidate>.json`: what release mode judged for that candidate (`docs/contract/release-record.schema.json`).
          - `releases/<release>.json`: the newest candidate of that release that could ship. `post-deploy.yml` reads this one.
          - `reports/index.json`: every judged candidate, newest first; `reports/<ranAt>-release/report.{json,md,html}` for each.

          See `docs/contract.md`, "The release record", on the default branch.
          README
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md releases
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then echo "the record is already published"; exit 0; fi
          git commit -q -m "release record: ${candidate} (${release})"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push "https://github.com/${GITHUB_REPOSITORY}.git" release-records

  # The release scoreboard (docs/contract.md, "The scoreboard"): this run's line, appended to scoreboard/releases.jsonl on the
  # `scoreboard` branch of THIS repository. main takes changes only through a pull request (its ruleset), so the line goes to
  # a data branch the way the release records do: one commit per line, never forced, and the file only ever gains lines
  # (checked before the push). A PR may copy the file to main; `harness guard scoreboard` lets it only add lines there too.
  # Advisory, and after the gate: it scores the finished reports (harness confidence), so nothing here reaches a verdict.
  scoreboard:
    name: Append the scoreboard line
    needs: [release, migration, upgrade]
    # A run that never reached a verdict left no report: nothing to score, and that is not an error.
    if: always() && needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushes this repository's `scoreboard` branch and nothing else.
      contents: write
    concurrency:
      group: scoreboard-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: harness
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: harness/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: harness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-report
          path: reports/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: migration-report
          path: reports/migration
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: upgrade-report
          path: reports/upgrade
      # Change risk and the per-PR risk lines: the monorepo's history between the two tags (public; read-only). Without it
      # change risk is "not measured" on the line, never assumed clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: tutors-sdk/tutors-mono-repo
          persist-credentials: false
          fetch-depth: 0
          path: mono
      - name: What changed between the two tags
        continue-on-error: true
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm harness changes --a "$PRODUCTION" --b "$CANDIDATE" --monorepo ../mono --out ../changes.json
      - name: Score the run and append its line
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$(find reports/release -path '*-release/report.json' 2>/dev/null | head -1)"
          if [ -z "$report" ]; then echo "no release report (release mode did not reach a verdict): nothing to score, no line"; exit 0; fi
          case "$CANDIDATE" in *[!A-Za-z0-9._-]*) echo "unsafe candidate tag: refusing to append" >&2; exit 1;; esac
          run_dir="$PWD/$(dirname "$report")"
          migration="$(find reports/migration -path '*-migration/report.json' 2>/dev/null | head -1)"
          upgrade="$(find reports/upgrade -path '*-upgrade/report.json' 2>/dev/null | head -1)"
          score=(--run "$run_dir")
          if [ -n "$migration" ]; then score+=(--migration "$PWD/$(dirname "$migration")"); fi
          if [ -n "$upgrade" ]; then score+=(--upgrade "$PWD/$(dirname "$upgrade")"); fi
          if [ -f changes.json ]; then score+=(--change-risk "$PWD/changes.json"); fi
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote --exit-code --heads "$remote" refs/heads/scoreboard > /dev/null 2>&1; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" clone -q --depth 1 --branch scoreboard "$remote" publish
          else
            git init -q -b scoreboard publish
          fi
          mkdir -p publish/scoreboard
          touch publish/scoreboard/releases.jsonl
          cp publish/scoreboard/releases.jsonl before.jsonl
          # Scored after the branch is fetched: the glance's novelty reads the releases already on the scoreboard.
          score+=(--scoreboard "$PWD/publish/scoreboard/releases.jsonl")
          (cd harness && pnpm harness confidence "${score[@]}")
          (cd harness && pnpm harness scoreboard append --run "$run_dir/confidence.json" --file ../publish/scoreboard/releases.jsonl --tag "$CANDIDATE" --run-url "$RUN_URL")
          # Append-only, checked on the bytes: the file before this run must be exactly the start of the file after it.
          head -c "$(wc -c < before.jsonl)" publish/scoreboard/releases.jsonl | cmp -s - before.jsonl || { echo "the scoreboard would lose or change a line: refusing to push" >&2; exit 1; }
          (cd harness && pnpm harness scoreboard trends --file ../publish/scoreboard/releases.jsonl)
          cat > publish/README.md <<'README'
          # scoreboard

          Written by the `scoreboard` job of `.github/workflows/release.yml` (one line per release run) and the `record` job of
          `.github/workflows/weekly-mutants.yml` (one line per weekly self-test). Append-only, never forced. Do not edit.

          - `scoreboard/releases.jsonl`: one line per release run (`docs/contract/scoreboard-line.schema.json`); a re-run is the same tag with the next run number.
          - `scoreboard/mutants.jsonl`: the harness's weekly mutants, caught of planted.

          `harness scoreboard trends --file scoreboard/releases.jsonl` reads it; the reports site draws it (scoreboard.html).
          See `docs/contract.md`, "The scoreboard", on the default branch.
          README
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scoreboard/releases.jsonl
          if git diff --cached --quiet; then echo "nothing new on the scoreboard"; exit 0; fi
          git commit -q -m "scoreboard: ${CANDIDATE}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push "https://github.com/${GITHUB_REPOSITORY}.git" scoreboard

  # An override is a recorded event. The reports carry it (override.applied); this opens one issue per applied
  # override in THIS repository, so the quarterly count is `gh issue list --label harness-override`.
  override-record:
    name: Record a harness override
    needs: [release, migration, upgrade]
    if: always() && inputs.override_reason != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-report"
          path: reports
      - name: Open an issue for each override that was applied
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create harness-override --color D93F0B --description "A harness FAIL was overridden" 2>/dev/null || true
          found=0
          while IFS= read -r report; do
            [ "$(jq -r '.override.applied // false' "$report")" = "true" ] || continue
            found=1
            mode="$(jq -r '.mode' "$report")"
            by="$(jq -r '.override.by' "$report")"
            { cat "$(dirname "$report")/report.md"; printf '\nRun: %s\n' "$RUN_URL"; } > body.md
            gh issue create --title "Harness FAIL overridden (${mode}) by ${by}, $(date -u +%Y-%m-%d)" --label harness-override --body-file body.md
          done < <(find reports -name report.json)
          [ "$found" = 1 ] || echo "override_reason was given but no FAIL needed overriding: nothing to record"
