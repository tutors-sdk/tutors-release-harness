# Release gate: the candidate beside the production tag. Dispatched by the
# monorepo when a release branch is pushed (docs/monorepo/release-dispatch.yml)
# or run by hand.
#
# Three jobs, all against the same two tags:
#   release   — A/B with claims, 3 runs, k6; FAILS on an unclaimed diff only
#               when a clean nightly A/A from the last week exists
#   migration — the candidate's migrations on the production schema
#   upgrade   — the candidate rolled in under load through the edge
name: Release harness

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Production tag (side a)"
        required: true
      candidate:
        description: "Candidate tag (side b)"
        required: true
      claims_url:
        description: "Raw URL of the release's claims.yaml (optional)"
        required: false
      migrations_a:
        description: "Monorepo git ref for production's migrations (default v<production>)"
        required: false
      migrations_b:
        description: "Monorepo git ref for the candidate's migrations (default v<candidate>)"
        required: false
      runs:
        description: "Journey repetitions per side"
        required: false
        default: "3"
  repository_dispatch:
    types: [release-candidate]

permissions:
  contents: read
  actions: read

env:
  HARNESS_IMAGE_PREFIX: ${{ vars.HARNESS_IMAGE_PREFIX || 'quay.io/tutors-sdk/tutors-{app}' }}
  # Empty means the default: the monorepo's image-build.yml workflow (src/images.ts).
  HARNESS_COSIGN_IDENTITY: ${{ vars.HARNESS_COSIGN_IDENTITY }}
  PRODUCTION: ${{ inputs.production || github.event.client_payload.production }}
  CANDIDATE: ${{ inputs.candidate || github.event.client_payload.candidate }}
  CLAIMS_URL: ${{ inputs.claims_url || github.event.client_payload.claims_url }}
  RUNS: ${{ inputs.runs || github.event.client_payload.runs || '3' }}

jobs:
  release:
    name: Release mode (A/B, claims, k6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Pull and verify, or build, both sides
        run: pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE"

      - name: Fetch the release's claims
        if: env.CLAIMS_URL != ''
        run: curl -fsSL "$CLAIMS_URL" -o claims.yaml

      - name: Fetch the latest nightly noise status
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: nightly-noise.yml
          name: noise-status
          path: noise
          if_no_artifact_found: warn

      - name: Release mode
        run: |
          noise="$(ls noise/*/noise-status.json 2>/dev/null | head -1 || true)"
          pnpm harness run --mode release --a "$PRODUCTION" --b "$CANDIDATE" --runs "$RUNS" --load 20x30s \
            ${CLAIMS_URL:+--claims claims.yaml} ${noise:+--noise "$noise"}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-report
          path: out/
          retention-days: 30

      - name: Show the PR comment
        if: always()
        run: cat out/*-release/report.md >> "$GITHUB_STEP_SUMMARY"

  migration:
    name: Migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATIONS_A: ${{ inputs.migrations_a || github.event.client_payload.migrations_a }}
      MIGRATIONS_B: ${{ inputs.migrations_b || github.event.client_payload.migrations_b }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration mode
        run: pnpm harness run --mode migration --a "${MIGRATIONS_A:-v$PRODUCTION}" --b "${MIGRATIONS_B:-v$CANDIDATE}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-report
          path: out/
          retention-days: 30
      - if: always()
        run: cat out/*-migration/report.md >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: Upgrade rehearsal (rollout under load)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # `images ensure` verifies the cosign signature of every image it pulls (docs/images.md).
      # The images are signed with cosign 3, and verifying them needs cosign >= 3: installer v4 installs it.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Pull and verify, or build, both sides
        run: pnpm harness images ensure --a "$PRODUCTION" --b "$CANDIDATE"
      - name: Upgrade mode
        run: pnpm harness run --mode upgrade --a "$PRODUCTION" --b "$CANDIDATE" --set fixture --journey anonymous-student-reads-course
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-report
          path: out/
          retention-days: 30
      - if: always()
        run: cat out/*-upgrade/report.md >> "$GITHUB_STEP_SUMMARY"
