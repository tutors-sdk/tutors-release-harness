# After a deploy, and every fifteen minutes after that: run the reference-course
# journeys against production and compare with the candidate's recorded
# release-mode capture. A new difference (exit 1) opens a rollback issue with the report.
# Exit 2 is "could not judge" (an unusable input, an image that cannot be trusted, a run that
# stopped before a verdict): the workflow fails so it is seen and the summary says so, but no
# rollback issue is opened, because nothing was found that says production is worse
# (docs/contract.md, "Exit codes").
#
# Dispatched by the monorepo's deploy job (repository_dispatch "deployed") and
# scheduled as the synthetic monitor. The recorded run is the release-report
# artifact of the latest successful release run.
#
# Since 1.3.0 the "deployed" payload may say what was deployed: `production` (the
# tag) and `digests` (app -> sha256:...). They are compared with the release record
# release mode left on the `release-records` branch, and a difference, or no record,
# is a WARNING (docs/contract.md, "Checking a deployment"). Without them, as in 1.2.0,
# nothing is compared.
name: Post-deploy and synthetic monitor

on:
  repository_dispatch:
    types: [deployed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      recorded_run_id:
        description: "Workflow run id of the release harness whose report to compare against (default: latest)"
        required: false

permissions:
  contents: read
  actions: read
  issues: write

# One group per trigger. A group holds one running and one pending run, and a newer pending run replaces the
# pending one: with a single group, the next quarter-hour's scheduled run could cancel a `deployed` dispatch that
# was waiting behind a monitor run, and the check of that deployment would never run. Split by event, a scheduled
# run only ever replaces another scheduled run, and a dispatch waits for (or replaces) only another dispatch.
concurrency:
  group: post-deploy-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  post-deploy:
    # The runner image the nightly A/A calibrated the noise floor on (nightly-noise.yml pins the same one).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYED: ${{ github.event.client_payload.production }}
      DEPLOYED_DIGESTS: ${{ github.event.client_payload.digests && toJSON(github.event.client_payload.digests) || '' }}
      PRODUCTION_URLS: ${{ vars.HARNESS_PRODUCTION_URLS || 'reader=https://tutors.dev,catalogue=https://catalogue.tutors.dev,live=https://live.tutors.dev' }}
      # What the apps load from Google Fonts, Iconify and jsDelivr, as recorded once (src/collectors/third-party-cache.ts): the
      # default of a local run is HARNESS_HOME/third-party-cache, the same place.
      HARNESS_THIRD_PARTY_CACHE_DIR: ${{ github.workspace }}/.harness/third-party-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The browser is answered from one recorded copy of what the apps load from Google Fonts, Iconify and jsDelivr: the same
      # bytes on both sides, at once, so a font or an icon cannot arrive on one side only, and an outage of those hosts breaks
      # nothing (docs/noise-burndown.md). The key never matches exactly; restore-keys picks the newest entry.
      - name: Restore the recorded third-party responses
        id: third-party-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ github.run_id }}
          restore-keys: |
            third-party-v1-

      # A deploy, or a person naming a run, must have a recording: none fails the job. The schedule may have none (no
      # release has passed in the artifact's 30 days), and then there is nothing to compare production with: the
      # monitor says so in the summary and stands down, rather than failing every run and teaching people to ignore it.
      - name: Fetch the recorded release run
        uses: dawidd6/action-download-artifact@634d83b91986fcec9be314054943fa5c976aeb0e # v25
        with:
          workflow: release.yml
          name: release-report
          path: recorded
          run_id: ${{ inputs.recorded_run_id }}
          if_no_artifact_found: ${{ github.event_name == 'schedule' && 'ignore' || 'fail' }}

      - name: Check there is a recording to compare with
        id: recording
        run: |
          if ls -d recorded/*-release >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Synthetic monitor: nothing to compare with"
              echo
              echo "No successful release run has a \`release-report\` artifact (kept 30 days), so production was not checked."
              echo "The monitor resumes by itself after the next release run that passes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Synthetic monitor stood down::no recorded release run to compare production with"
          fi

      # The latest status the nightly published to the `noise` branch (see release.yml). Missing or unusable: WARN, never FAIL.
      - name: Fetch the latest noise status
        id: noise
        if: steps.recording.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p noise
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/noise-status.json?ref=noise" > noise/noise-status.json 2>/dev/null || rm -f noise/noise-status.json
          pnpm harness noise status --store noise

      # The release record of what was deployed, from the `release-records` branch. Missing is not an error: the run
      # then says so, loudly, as a warning. The tag is checked before it names a file.
      - name: Fetch the release record
        if: steps.recording.outputs.found == 'true' && env.DEPLOYED != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$DEPLOYED" in *[!A-Za-z0-9._-]*|"") echo "the deployed tag is not a tag: not fetching a record" >&2; exit 1;; esac
          mkdir -p releases
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/releases/${DEPLOYED}.json?ref=release-records" > "releases/${DEPLOYED}.json" 2>/dev/null || rm -f "releases/${DEPLOYED}.json"

      - name: Post-deploy mode
        id: run
        if: steps.recording.outputs.found == 'true'
        env:
          NOISE_FILE: ${{ steps.noise.outputs.noise_file }}
        # The exit code is kept for the steps below: 1 is a difference (a rollback issue), 2 is "could not judge" (no issue).
        run: |
          recorded="$(find recorded -mindepth 1 -maxdepth 1 -type d -name '*-release' | sort | head -1)"
          set +e
          pnpm harness run --mode post-deploy --recorded "$recorded" --production "$PRODUCTION_URLS" ${NOISE_FILE:+--noise "$NOISE_FILE"} \
            ${DEPLOYED:+--deployed "$DEPLOYED" --release-record releases} ${DEPLOYED_DIGESTS:+--deployed-digests "$DEPLOYED_DIGESTS"}
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.recording.outputs.found == 'true'
        with:
          name: post-deploy-report
          path: out/
          retention-days: 14

      # Exit 2: no verdict. The run step has already failed the job; this makes it say why, in the run's summary.
      - name: Say that the harness could not judge
        if: failure() && steps.run.outputs.exit_code == '2'
        run: |
          {
            echo "### Post-deploy: could not judge"
            echo
            echo "The harness exited 2: it could not judge production against the recorded candidate (see the step log for why)."
            echo "This is not a finding about production, so no rollback issue was opened. The run is marked failed so that it is seen."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Post-deploy could not judge::the harness exited 2 (no verdict); no rollback issue was opened"

      # Exit 1 only: a difference the claims and the A/A rule did not excuse.
      - name: Open a rollback issue
        if: failure() && steps.run.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # One open rollback issue at a time. The monitor runs on a schedule and finds the same differences until someone acts,
        # so a run whose differences an open issue already carries (the signature of the report's "Unclaimed differences"
        # section) adds nothing; different differences are a comment on that issue; with none open, a new issue.
        run: |
          report="$(find out -path '*-post-deploy/report.md' | head -1)"
          signature="$(sed -n '/^### Unclaimed differences/,/^### /p' "$report" | sha256sum | cut -c1-16)"
          { cat "$report"; echo; echo "Report artifact: ${RUN_URL}"; echo; echo "<!-- rollback-signature: ${signature} -->"; } > body.md
          gh label create rollback --color B60205 --description "Production differs from the tested release" 2>/dev/null || true
          open="$(gh issue list --label rollback --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh issue create --title "Rollback candidate: production differs from the tested release ($(date -u +%Y-%m-%dT%H:%MZ))" \
              --label rollback --body-file body.md
          elif gh issue view "$open" --json body,comments --jq '([.body] + [.comments[].body]) | join("\n")' | grep -qF "rollback-signature: ${signature}"; then
            echo "The open rollback issue #${open} already carries these differences: nothing added." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue comment "$open" --body-file body.md
          fi

      # Saved under the hash of its content, and only when this run recorded something the restored copy did not have.
      - name: Keep the recorded third-party responses for later runs
        if: always() && hashFiles('.harness/third-party-cache/*.json') != '' && steps.third-party-cache.outputs.cache-matched-key != format('third-party-v1-{0}', hashFiles('.harness/third-party-cache/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .harness/third-party-cache
          key: third-party-v1-${{ hashFiles('.harness/third-party-cache/*.json') }}
