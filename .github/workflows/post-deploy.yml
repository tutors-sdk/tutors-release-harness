# After a deploy, and every fifteen minutes after that: run the reference-course
# journeys against production and compare with the candidate's recorded
# release-mode capture. A new difference (exit 1) opens a rollback issue with the report.
# Exit 2 is "could not judge" (an unusable input, an image that cannot be trusted, a run that
# stopped before a verdict): the workflow fails so it is seen and the summary says so, but no
# rollback issue is opened, because nothing was found that says production is worse
# (docs/contract.md, "Exit codes").
#
# Dispatched by the monorepo's deploy job (repository_dispatch "deployed") and
# scheduled as the synthetic monitor. The recorded run is the release-report
# artifact of the latest successful release run.
#
# Since 1.3.0 the "deployed" payload may say what was deployed: `production` (the
# tag) and `digests` (app -> sha256:...). They are compared with the release record
# release mode left on the `release-records` branch, and a difference, or no record,
# is a WARNING (docs/contract.md, "Checking a deployment"). Without them, as in 1.2.0,
# nothing is compared.
name: Post-deploy and synthetic monitor

on:
  repository_dispatch:
    types: [deployed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      recorded_run_id:
        description: "Workflow run id of the release harness whose report to compare against (default: latest)"
        required: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: post-deploy
  cancel-in-progress: false

jobs:
  post-deploy:
    # The runner image the nightly A/A calibrated the noise floor on (nightly-noise.yml pins the same one).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYED: ${{ github.event.client_payload.production }}
      DEPLOYED_DIGESTS: ${{ github.event.client_payload.digests && toJSON(github.event.client_payload.digests) || '' }}
      PRODUCTION_URLS: ${{ vars.HARNESS_PRODUCTION_URLS || 'reader=https://tutors.dev,catalogue=https://catalogue.tutors.dev,live=https://live.tutors.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Fetch the recorded release run
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: release.yml
          name: release-report
          path: recorded
          run_id: ${{ inputs.recorded_run_id }}
          if_no_artifact_found: fail

      # The latest status the nightly published to the `noise` branch (see release.yml). Missing or unusable: WARN, never FAIL.
      - name: Fetch the latest noise status
        id: noise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p noise
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/noise-status.json?ref=noise" > noise/noise-status.json 2>/dev/null || rm -f noise/noise-status.json
          pnpm harness noise status --store noise

      # The release record of what was deployed, from the `release-records` branch. Missing is not an error: the run
      # then says so, loudly, as a warning. The tag is checked before it names a file.
      - name: Fetch the release record
        if: env.DEPLOYED != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$DEPLOYED" in *[!A-Za-z0-9._-]*|"") echo "the deployed tag is not a tag: not fetching a record" >&2; exit 1;; esac
          mkdir -p releases
          gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/releases/${DEPLOYED}.json?ref=release-records" > "releases/${DEPLOYED}.json" 2>/dev/null || rm -f "releases/${DEPLOYED}.json"

      - name: Post-deploy mode
        id: run
        env:
          NOISE_FILE: ${{ steps.noise.outputs.noise_file }}
        # The exit code is kept for the steps below: 1 is a difference (a rollback issue), 2 is "could not judge" (no issue).
        run: |
          recorded="$(ls -d recorded/*-release | head -1)"
          set +e
          pnpm harness run --mode post-deploy --recorded "$recorded" --production "$PRODUCTION_URLS" ${NOISE_FILE:+--noise "$NOISE_FILE"} \
            ${DEPLOYED:+--deployed "$DEPLOYED" --release-record releases} ${DEPLOYED_DIGESTS:+--deployed-digests "$DEPLOYED_DIGESTS"}
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-report
          path: out/
          retention-days: 14

      # Exit 2: no verdict. The run step has already failed the job; this makes it say why, in the run's summary.
      - name: Say that the harness could not judge
        if: failure() && steps.run.outputs.exit_code == '2'
        run: |
          {
            echo "### Post-deploy: could not judge"
            echo
            echo "The harness exited 2: it could not judge production against the recorded candidate (see the step log for why)."
            echo "This is not a finding about production, so no rollback issue was opened. The run is marked failed so that it is seen."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Post-deploy could not judge::the harness exited 2 (no verdict); no rollback issue was opened"

      # Exit 1 only: a difference the claims and the A/A rule did not excuse.
      - name: Open a rollback issue
        if: failure() && steps.run.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { cat out/*-post-deploy/report.md; echo; echo "Report artifact: ${RUN_URL}"; } > body.md
          gh label create rollback --color B60205 --description "Production differs from the tested release" 2>/dev/null || true
          gh issue create --title "Rollback candidate: production differs from the tested release ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --label rollback --body-file body.md
